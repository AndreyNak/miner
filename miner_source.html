<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Miner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="hud"></div>
  <div id="wrap">
    <canvas id="c" width="960" height="540"></canvas>
    <div id="toast-container"></div>
    <div id="dev">
        <span id="devs"></span>
        <input id="code" placeholder="код разраб." autocomplete="off">
        <button id="okc">OK</button>
    </div>
    <button id="teleportButton" title="Телепорт на базу (F)"><span class="inner" id="teleportLabel"></span></button>
    <button id="dirtButton" class="hidden" title="Земля"></button>
    <div id="modal" class="h"></div>
    <div id="dirtModal" class="hidden"></div>
  </div>
  <div id="chartOverlay" style="display:none;position:fixed;inset:0;z-index:100;background:#0d0f14">
    <canvas id="incomeChart" style="display:block;width:100%;height:100%"></canvas>
  </div>
  <div id="help">A/D — ходить · W/Пробел — прыжок · ПКМ — копать · ЛКМ — бить оружием · F — телепорт на базу · B —
    магазин (на базе) · G - график · 
    <button id="callw">Позвать волну сейчас</button>
    <button id="toggle_world">Сменить мир</button>
    <button id="toggle_music" title="Музыка">🎵</button>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/approximate-number@2.1.1/lib/approximate-number.js"></script>
  <script src="data.js"></script>
  <script src="chart.js"></script>
  <script src="draw.js"></script>
  <script src="sounds.js"></script>
  <script>
    /* ======================================================================
       MINER — оглавление
       1. Настройки и данные (константы, блоки, оружие, инструменты, улучшения)
       2. Состояние игры (все изменяемые переменные)
       3. Вспомогательные функции
       4. Создание мира, игрока и новой игры
       5. Действия игрока (движение, копание, атака, телепорт)
       6. Враги и волны
       7. Обновление игры (один кадр)
       8. Отрисовка
       9. Магазин и интерфейс (HUD)
       10. Ввод (клавиатура, мышь) и главный цикл
       ====================================================================== */

    /* ============================ 1. НАСТРОЙКИ ============================ */

    // --- Размеры мира и экрана ---
    const TILE_SIZE = 20;                 // размер одного блока в пикселях
    const WORLD_WIDTH = 48;               // ширина мира в блоках
    const WORLD_HEIGHT = 150;              // высота мира в блоках
    const SURFACE_ROW = 12;                // номер строки, с которой начинается земля
    const GROUND_Y = SURFACE_ROW * TILE_SIZE;   // координата Y поверхности в пикселях
    const CANVAS_WIDTH = 960;
    const CANVAS_HEIGHT = 540;


    // --- Игрок
    const PLAYER_WIDTH = 12
    const PLAYER_HEIGHT = 18;
    const STAR_POSITION_PLAYER = {x: 10 * TILE_SIZE, y: GROUND_Y - PLAYER_HEIGHT}

    // --- Основная база (20% ширины мира, высота — половина ширины) ---
    const BASE_WIDTH = TILE_SIZE * 10;
    const BASE_LEFT = (WORLD_WIDTH * TILE_SIZE - BASE_WIDTH) / 2;
    const BASE_HEIGHT = BASE_WIDTH / 2;
    const BASE_TOP = GROUND_Y - BASE_HEIGHT;
    const BASE_CENTER_X = BASE_LEFT + BASE_WIDTH / 2;

    // -- База экспедиции

    // --- Физика и общие параметры ---
    const GRAVITY = 900;
    const MAX_FALL_SPEED = 500;
    const DIG_COOLDOWN = 0.18;            // пауза между ударами инструментом (сек)
    const REVEAL_RADIUS = 10;              // радиус, который игрок открывает из тумана (блоки)
    const FOG_DIM_RADIUS = 8;             // дальше этого радиуса исследованная зона затемняется
    const FOG_SOLID_BLOCKS_VISIBLE = 1; // сколько твёрдых блоков "пробивает" взгляд: 1 = виден только первый блок, дальше туман
    const TURRET_RANGE = 130;             // дальность орудия базы от края базы (пиксели)
    const SLOT_COUNT = 9, SLOT_SIZE = 44, SLOT_GAP = 4;

    // --- Пещеры ---
    const CAVE_WORM_COUNT = 12;            // сколько червеобразных ходов создаётся
    const CAVE_SLIME_LIMIT = 40;          // максимум синих слизней в пещерах
    const CAVE_SLIME_CHASE_DISTANCE = 110;
    const CAVE_RESPAWN_INTERVAL_SEC = 20;   // раз в сколько секунд появляется новый слизень
    const CAVE_RESPAWN_MIN_DISTANCE = 12;   // не ближе скольких блоков к игроку
    const CAVE_CHESTS_LIMIT = 4;            // максимум сундуков в пещерах
    const SLIME_JUMP_POWER = 300;      // сила прыжка слизня (высота ~50 пикселей, чуть выше 2 блоков)
    const SLIME_MAX_STEP_BLOCKS = 2;

    // --- Волны ---
    const FIRST_WAVE_DELAY_SEC = 180;     // первая волна через 3 минуты
    const MAX_WAVE_DELAY_MIN = 6;         // потолок ожидания между волнами
    const SPAWN_INTERVAL_SEC = 1.2;       // пауза между появлением врагов в волне
    const SLIME_CHASE_DISTANCE = 90; // дистанция приследования за игроком

    // --- Лестница ---
    const LADDER_PACK_SIZE = 10;        // сколько лестниц в одной покупке
    const LADDER_PACK_PRICE = 40;       // цена пачки
    const LADDER_STACK_LIMIT = 100;     // максимум лестниц в инвентаре
    const LADDER_CLIMB_SPEED = 180;      // скорость подъёма и спуска (пиксели в секунду)
    const LADDER_REACH_TILES = 3;       // на каком расстоянии от игрока можно поставить лестницу
    const LADDER_PLACE_COOLDOWN = 0.5; // пауза между установками при зажатой кнопке
    const LADDER_ITEM = { name: 'Лестница', color: '#c8934a' };

    // --- Призывалка босса
    const BOSS_PACK_SIZE = 1;
    const BOSS_PACK_PRICE = 50000;
    const BOSS_STACK_LIMIT = 1

     // --- Динамит ---
    const DYNAMITE_FUSE_SEC = 3;             // через сколько секунд взрыв
    const DYNAMITE_RADIUS_TILES = 3.5;       // радиус взрыва (не улучшается)
    const DYNAMITE_REACH_TILES = 3;          // на каком расстоянии от игрока можно поставить
    const DYNAMITE_PLACE_COOLDOWN = 0.4;     // пауза между установками при зажатой кнопке
    const DYNAMITE_PACK_SIZE = 5;            // сколько штук в одной покупке
    const DYNAMITE_STACK_LIMIT = 10;         // максимум в инвентаре
    const EXPLOSION_ANIM_SEC = 0.35;         // длительность вспышки взрыва
    const DYNAMITE_ITEM = { name: 'Динамит', color: '#d33a2c' };

     // Элементы страницы
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const hudElement = document.getElementById('hud');
    const shopElement = document.getElementById('modal');
    const devLabelElement = document.getElementById('devs');
    const devCodeInput = document.getElementById('code');

    // Лес
    function generateForest(spacing) {
      const trees = [];
      for (let x = 0; x < CANVAS_WIDTH + 100; x += spacing + Math.random() * spacing) {
        trees.push({
          x: x,
          trunkHeight: 20 + Math.random() * 15,   // высота ствола
          trunkWidth:  4 + Math.random() * 2,     // толщина ствола
          crownSize:   20 + Math.random() * 15,   // диаметр кроны
        });
      }
      return { trees };
    }

    const forestFar  = generateForest(70);
    const forestNear = generateForest(50);

    
    // --- Улучшения магазина ---
    // steps: [цена, новое значение]. describe — текущее состояние, format — подпись следующей ступени, apply — применить.
    // Состояние (player, baseState) объявлено ниже, функции вызываются позже, поэтому порядок объявления не важен.
    const formatPercent = value => Math.round(value * 100) + '%';
    const UPGRADES = {
      energy: {
        title: 'Энергия', steps: [[25, 50], [150, 100], [1000, 220], [8000, 480], [30000, 750]],
        describe: () => 'Макс. энергия: ' + player.maxEnergy, format: v => v,
        apply: v => {player.maxEnergy = v; player.energy = v;}
      },
      energyRegen: {
        title: 'Регенерация энергии', steps: [[25, 2], [200, 4], [1000, 9], [7500, 15], [35000, 20]],
        describe: () => 'Сейчас ' + player.energyRegen + '/сек вне базы', format: v => v + '/сек',
        apply: v => player.energyRegen = v
      },
      energySaving: {
        title: 'Экономия энергии', steps: [[200, 0.15], [1500, 0.2], [6500, 0.3]],
        describe: () => 'Меньше затраты на удары и копание: −' + formatPercent(player.energySaving), format: formatPercent,
        apply: v => player.energySaving = v
      },
      maxHp: {
        title: 'Макс. HP', steps: [[40, 150], [200, 200], [1100, 300], [8000, 450]],
        describe: () => 'Сейчас ' + player.maxHp, format: v => v,
        apply: v => {player.hp += v - player.maxHp; player.maxHp = v;}
      },
      hpRegen: {
        title: 'Регенерация HP', steps: [[60, 1], [1200, 3], [8800, 7]],
        describe: () => 'Сейчас ' + player.hpRegen + '/сек вне базы', format: v => v + '/сек',
        apply: v => player.hpRegen = v
      },
      armor: {
        title: 'Броня', steps: [[150, 0.1], [800, 0.2], [3500, 0.35]],
        describe: () => 'Снижает урон на ' + formatPercent(player.armor), format: formatPercent,
        apply: v => player.armor = v
      },
      maxOxygen: {
        title: 'Макс. кислорода', steps: [[60, 200], [1200, 850], [6500, 3500], [10000, 8000], [20000, 15000]],
        describe: () => 'Сейчас ' + player.maxOxygen, format: v => v,
        apply: v => {player.oxygen += v - player.maxOxygen; player.maxOxygen = v;}
      },
      oxygenRegen: {
        title: 'Регенерация кислорода', steps: [[200, 100], [1500, 300], [7000, 1500], [12000, 4000]],
        describe: () => 'Сейчас ' + player.oxygenRegen + '/сек', format: v => v,
        apply: v => player.oxygenRegen = v
      },
      oxygenFreeDepth: {
        title: 'Глубина потребления кислорода', steps: [[400, 15], [1500, 30], [6000, 45], [15000, 60]],
        describe: () => ' Сейчас ' + player.oxygenFreeDepth, format: v => v,
        apply: v => player.oxygenFreeDepth = v
      },
      moveSpeed: {
        title: 'Скорость бега', steps: [[50, 110], [800, 130], [6000, 155]],
        describe: () => 'Сейчас ' + player.moveSpeed, format: v => v,
        apply: v => player.moveSpeed = v
      },
      jumpPower: {
        title: 'Высота прыжка', steps: [[80, 320], [600, 360], [3000, 400]],
        describe: () => 'Сейчас ' + player.jumpPower, format: v => v,
        apply: v => player.jumpPower = v
      },
      luck: {
        title: 'Удача шахтёра', steps: [[80, 0.25], [1500, 0.35], [9000, 0.45]],
        describe: () => 'Бонус очков с блоков: +' + formatPercent(player.luck), format: v => '+' + formatPercent(v),
        apply: v => player.luck = v
      },
      teleportCooldown: {
        title: 'Перезарядка телепорта', steps: [[200, 30], [800, 25], [3500, 20], [10000, 15]],
        describe: () => 'Сейчас ' + player.teleportCooldownSec + ' с', format: v => v + ' с',
        apply: v => player.teleportCooldownSec = v
      },
      dynamite: { 
        title: 'Улучшение динамита', steps: [[15000, 1], [25000, 2]],
        describe: () => { const s = getDynamiteStats(); return 'Сейчас: Ломает руду до ур. ' + s.maxBlockLevel},
        format: v => 'Ломает руду до ур. ' + DYNAMITE_LEVELS[v].maxBlockLevel,
        apply: () => {} 
      },
      baseEnergyRegen: {
        title: 'Регенерация энергии у базы', steps: [[150, 15], [800, 30], [3500, 45], [9000, 80], [50000, 160]],
        describe: () => 'Сейчас ' + baseState.energyRegen + '/сек', format: v => v + '/сек',
        apply: v => baseState.energyRegen = v
      },
      baseHealRate: {
        title: 'Лечение у базы', steps: [[200, 20], [1000, 40], [5200, 80]],
        describe: () => 'Сейчас ' + baseState.playerHealRate + ' HP/сек', format: v => v + '/сек',
        apply: v => baseState.playerHealRate = v
      },
      baseMaxHp: {
        title: 'HP базы', steps: [[250, 750], [2000, 1000], [10000, 1500], [50000, 2000]],
        describe: () => 'Макс. HP базы: ' + baseState.maxHp, format: v => v,
        apply: v => {baseState.hp += v - baseState.maxHp; baseState.maxHp = v;}
      },
      baseRepair: {
        title: 'Авторемонт базы', steps: [[300, 1], [1200, 3], [4000, 8], [15000, 16]],
        describe: () => 'Сейчас ' + baseState.repairRate + ' HP/сек', format: v => v + ' HP/сек',
        apply: v => baseState.repairRate = v
      },
      baseMining: {
        title: 'Автозарабаток', steps: [[200,  3], [1500, 15], [8000, 90]],
        describe: () => 'Сейчас ' + baseState.miningRate + ' очков/сек', format: v => v + ' очков/сек',
        apply : v => baseState.miningRate = v
      },
      turret: {
        title: 'Орудие базы', steps: [[500, 1], [1500, 2], [6000, 3], [25000, 4]],
        describe: () => baseState.turretLevel ? 'Ур. ' + baseState.turretLevel + ': урон ' + TURRET_LEVELS[baseState.turretLevel].damage + ', 1 выстрел/' + TURRET_LEVELS[baseState.turretLevel].cooldown + 'с' : 'Не построено',
        format: v => 'ур. ' + v + ' (урон ' + TURRET_LEVELS[v].damage + ', 1/' + TURRET_LEVELS[v].cooldown + 'с)',
        apply: v => baseState.turretLevel = v
      },
      maxFuel: {
        title: 'Макс. топлива', steps: [[100000, 100]],
        describe: () => 'Сейчас ' + baseState.maxFuel, format: v => v,
        apply: v => baseState.maxFuel = v
      },
      fuelRegen: {
        title: 'Регенерация Топлива', steps: [[150000, 1], [400000, 2]],
        describe: () => 'Сейчас ' + baseState.fuelRegen + '/сек', format: v => v + '/сек',
        apply: v => baseState.fuelRegen = v
      }
    };

    const SHOP_REVEAL_RULES = [
      ['Персонаж',    'energySaving',     () => player.energy >= 100],
      ['Персонаж',    'maxHp',            () => player.hp < Math.round(player.maxHp * 0.9)],
      ['Персонаж',    'hpRegen',          () => player.hp < Math.round(player.maxHp * 0.5)],
      ['Персонаж',    'armor',            () => waveNumber === 3],
      ['Персонаж',    'maxOxygen',        () => getDepthPlayer() > 10],
      ['Персонаж',    'oxygenRegen',      () => getDepthPlayer() > 15],
      ['Персонаж',    'oxygenFreeDepth',  () => getDepthPlayer() > 30],
      ['Персонаж',    'moveSpeed',        () => waveNumber === 1],
      ['Персонаж',    'jumpPower',        () => player.moveSpeed >= 110],
      ['Персонаж',    'luck',             () => player.toolIndex >= 1],
      ['Персонаж',    'teleportCooldown', () => countStack('ladder') >= 10],
      ['База',        'baseMaxHp',        () => player.hp >= Math.round(baseState.maxHp * 0.45)],
      ['База',        'baseRepair',       () => waveNumber === 5],
      ['База',        'baseMining',       () => player.toolIndex >=2],
      ['База',        'turret',           () => waveNumber === 4],
      ['База',        'maxFuel',          () => bossSlimeDead === true],
      ['База',        'fuelRegen',        () => bossSlimeDead === true],
      ['Расходники', 'ladder',            () => getDepthPlayer() > 2],
      ['Расходники', 'dynamite',          () => getDepthPlayer() > 35],
      ['Расходники', 'dynamiteUpgrade',   () => getDepthPlayer() > 80],
      ['Расходники', 'bossSlime',         () => canSummonSlimeBoss === true],
    ];

    function getTitleFor(category, key) {
      // Явные заголовки для расходников
      const CONSUMABLE_TITLES = {
          ladder:           'Лестницы',
          dynamite:         'Динамит',
          bossSlime:        'Приманка для босса',
          dynamiteUpgrade:  'Улучшение динамита',
      };
      return CONSUMABLE_TITLES[key] ?? UPGRADES[key]?.title ?? key;
    }

    function getShopTabs() {
      return  isMainBase ? SHOP_TAB_NAMES : SHOP_TAB_NAMES.filter((name) => name == 'База')
    }

    function managerDisplayShopItems() {
      for (const [category, key, condition] of SHOP_REVEAL_RULES) {
        if (!visibleShopItems[category]) visibleShopItems[category] = [];
        if (visibleShopItems[category].includes(key)) continue;
        if (!condition()) continue;
        visibleShopItems[category].push(key);
        showToast(getTitleFor(category, key), { type: 'info' });
      }

      for (const category in visibleShopItems) {
        const order = SHOP_TABS[category];
        if (!order) continue;
        visibleShopItems[category].sort((a, b) => {
            const ia = order.indexOf(a), ib = order.indexOf(b);
            return (ia === -1 ? Infinity : ia) - (ib === -1 ? Infinity : ib);
        });
      }
    }

    /* ======================== 2. СОСТОЯНИЕ ИГРЫ ======================== */

    function currentWorldData() {
      return world[current_planet].biomes[current_biome];
    }

    function getMainBase() {
      for (const [worldName, w] of Object.entries(world)) {
        for (const [biomeName, biome] of Object.entries(w.biomes)) {
          if (biome.isMainBase) return { worldName, biomeName, biome };
        }
      }
      throw new Error('Main base not found — проверь isMainBase');
    }

    const WORLD_FIELDS = [
      'blocks',           // blocks[строка][столбец] — тип блока (0 = пусто)
      'blockDurability',  // оставшаяся крепкость
      'floorTiles',       // пустые ячейки
      'ladders',          // ladders[строка][столбец] = true, если стоит лестница
      'explored',         // открыта ли клетка из тумана
      'dynamites',        // поставленный динамит: { col, row, timer }
      'explosions',       // вспышки взрывов отрисовки
      'enemies',          // все враги: и волны, и пещерные слизни
      'chests',           // сундуки
      'turretBeams',      // вспышки выстрелов орудия базы
      'waveNumber',
      'waveActive',
      'waveTimer',
      'isMainBase',
    ];

    for (const field of WORLD_FIELDS) {
      Object.defineProperty(globalThis, field, {
        configurable: true, 
        enumerable: true,
        get() { return currentWorldData()[field]; },
        set(v) { currentWorldData()[field] = v; },
      });
    }

    let player;                 // объект игрока (создаётся в createPlayer)
    let floatingTexts = [];     // всплывающие числа (+очки, -урон)     
    let visibleShopItems = [];  // Отображает доступные по прогрессу улучшения в магазине
    let tempVisibleShopItems = []; // Временное хранилище, доступных улучшений
    let current_biome;
    let current_planet;
    let main_biome;
    let expedition_time_left = 120;
    let showHitboxes = false;


    let world = {
      earth: {
        biomes: {
          slime_valley: {
            blocks: [],
            blockDurability: [],
            floorTiles: [],
            explored: [],
            enemies: [],
            ladders: [], 
            chests: [],
            dynamites: [],
            explosions: [],
            turretBeams: [],
            waveNumber: 0,
            waveActive: false,
            waveTimer: FIRST_WAVE_DELAY_SEC,
            isMainBase: true,
          },
          sand_dunes: {
            blocks: [],
            blockDurability: [],
            floorTiles: [],
            explored: [],
            enemies: [],
            ladders: [], 
            chests: [],
            dynamites: [],
            explosions: [],
            turretBeams: [],
            waveNumber: 0,
            waveActive: false,
            waveTimer: FIRST_WAVE_DELAY_SEC,
            isMainBase: false
          }
        }
      },
      mars: {
        biomes: {

        }
      }
    };

    const snapshotEmptyWorld = structuredClone(world);

    let points = 0;             // очки игрока
    let baseState;              // состояние базы
    let miniBaseState;          // состояние базы экспедиции
    let ownedWeapons = [], ownedTools = [];
    let upgradeLevels = {};     // сколько ступеней купили в каждом улучшении

    let spawnQueue = [], spawnTimer = 0;
    let canSummonSlimeBoss = false, bossFightActive = false, bossSlimeDead = false;
    let isGameOver = false;
    let messageText = '', messageTimer = 0;
    let isShopOpen = false, shopTab = 'Персонаж';
    let isDirtWindowOpen = false;
    let devModeEnabled = false;
    let cameraY = 0;
    let turretTimer = 0;
    let caveRespawnTimer = 0;
    let fps = 0, fpsFrameCount = 0, fpsTimer = 0;
    let projectiles = [];

    const keysDown = {};
    const mouse = {x: 0, y: 0, leftDown: false, rightDown: false};

    /* ===================== 3. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ===================== */

    // Детерминированное "случайное" число 0..1 по зерну (для текстур и распределения блоков)
    function pseudoRandom(seed) {const s = Math.sin(seed) * 10000; return s - Math.floor(s);}
  
    function showMessage(text) {messageText = text; messageTimer = 2.5;}
    function addFloatingText(x, y, text, color) {floatingTexts.push({x, y, text, color, timer: 1});}
    function getDepthPlayer() { return Math.max(0, Math.floor((player.y + player.height - GROUND_Y) / TILE_SIZE)) }

    function getEnemyRect(enemy) {
      return {
        left: enemy.x - enemy.width / 2,
        top: enemy.y - enemy.height,
        width: enemy.width,
        height: enemy.height
      };
    }

    function updateFps(realDeltaSec) {
      fpsFrameCount++;
      fpsTimer += realDeltaSec;
      if (fpsTimer >= 0.5) {
        fps = Math.round(fpsFrameCount / fpsTimer);
        fpsFrameCount = 0;
        fpsTimer = 0;
      }
    }


    function isSolidTile(col, row) {
      if (col < 0 || col >= WORLD_WIDTH || row >= WORLD_HEIGHT) return true;   // стены и дно мира
      if (row < 0) return false;
      return blocks[row][col] > 0;
    }
    // Пересекается ли прямоугольник (в пикселях) с твёрдыми блоками
    function boxHitsBlocks(x, y, width, height) {
      for (let col = Math.floor(x / TILE_SIZE); col <= Math.floor((x + width - 0.01) / TILE_SIZE); col++)
        for (let row = Math.floor(y / TILE_SIZE); row <= Math.floor((y + height - 0.01) / TILE_SIZE); row++)
          if (isSolidTile(col, row)) return true;
      return false;
    }

    // Считает твёрдые блоки на линии от игрока до клетки (сама клетка и стартовая не учитываются)
    function countSolidBlocksBetween(fromCol, fromRow, toCol, toRow) {
      const distance = Math.hypot(toCol - fromCol, toRow - fromRow);
      const steps = Math.ceil(distance * 4);                       // шаг луча 0.25 блока
      const startCol = Math.floor(fromCol), startRow = Math.floor(fromRow);
      const targetCol = Math.floor(toCol), targetRow = Math.floor(toRow);
      let lastCol = -1, lastRow = -1, solidCount = 0;
      for (let i = 0; i <= steps; i++) {
        const t = steps === 0 ? 0 : i / steps;
        const col = Math.floor(fromCol + (toCol - fromCol) * t);
        const row = Math.floor(fromRow + (toRow - fromRow) * t);
        if (col === lastCol && row === lastRow) continue;          // эту клетку уже проверили
        lastCol = col; lastRow = row;
        if ((col === startCol && row === startRow) || (col === targetCol && row === targetRow)) continue;
        if (isSolidTile(col, row)) solidCount++;
      }
      return solidCount;
    }

    function playerCenterX() {return player.x + player.width / 2;}
    function playerCenterY() {return player.y + player.height / 2;}
    function isPlayerInBaseZone() {
      return playerCenterX() > BASE_LEFT && playerCenterX() < BASE_LEFT + BASE_WIDTH
        && player.y + player.height > GROUND_Y - 4 && player.y < GROUND_Y + 2;
    }
    function isPlayerOnSurface() {return player.y + player.height > GROUND_Y - 4 && player.y < GROUND_Y + 2;}

    /* ================= 4. СОЗДАНИЕ МИРА, ИГРОКА, НОВАЯ ИГРА ================= */

    // Какой блок ставить на данной глубине: чем глубже, тем ценнее. roll — случайное число 0..1.
    function chooseBlockTypeByDepth(depth, roll) {
      const blocks_layers = BIOME_BLOCK_LAYERS[current_biome]
      return pickWeighted(findLayerByDepth(blocks_layers, depth).blocks, roll);
    }

    // Вырезает квадрат пустоты (ширина 3 или 4 блока) — кисть для пещер
    function carveCave(centerCol, centerRow, width) {
      for (let dc = -1; dc <= width - 2; dc++)
        for (let dr = -1; dr <= width - 2; dr++) {
          const col = centerCol + dc, row = centerRow + dr;
          if (col >= 0 && col < WORLD_WIDTH && row >= SURFACE_ROW + 3 && row <= WORLD_HEIGHT - 2) {
            blocks[row][col] = 0;
            blockDurability[row][col] = 0;
          }
        }
    }

    // Пещеры: червеобразные ходы шириной 3-4 блока на разной глубине
    function generateCaves() {
      for (let i = 0; i < CAVE_WORM_COUNT; i++) {
        let x = 2 + Math.random() * (WORLD_WIDTH - 4);
        let y = SURFACE_ROW + 6 + i * ((WORLD_HEIGHT - SURFACE_ROW - 12) / CAVE_WORM_COUNT) + Math.random() * 4;
        let angle = Math.random() * Math.PI * 2;     // случайное направление (0…360°)
        const length = 30 + Math.random() * 20;      // длина хода: 30–50 шагов
        const width = Math.random() < 0.5 ? 3 : 4;   // ширина: 3 или 4 блока
        for (let step = 0; step < length; step++) {
          carveCave(Math.round(x), Math.round(y), width);
          angle += (Math.random() - 0.5) * 0.7;
          x += Math.cos(angle);
          y += Math.sin(angle) * 0.7;
          x = Math.min(WORLD_WIDTH - 3, Math.max(2, x));
          y = Math.min(WORLD_HEIGHT - 4, Math.max(SURFACE_ROW + 4, y));
        }
      }
    }

    function generateBlocks() {
      ladders = [];
      const seed = Math.random() * 1000;
      blocks = []; blockDurability = []; explored = [];
      for (let row = 0; row < WORLD_HEIGHT; row++) {
        blocks[row] = []; blockDurability[row] = []; explored[row] = []; ladders[row] = [];
        for (let col = 0; col < WORLD_WIDTH; col++) {
          let blockType = 0;                                   // над землёй — воздух
          if (row >= SURFACE_ROW) {
            blockType = row === WORLD_HEIGHT - 1 ? BLOCK.VOID_ORE   // нижний слой мира
              : chooseBlockTypeByDepth(row - SURFACE_ROW, pseudoRandom(col * 37 + row * 101 + seed));
          }
          ladders[row][col] = false;
          blocks[row][col] = blockType;
          blockDurability[row][col] = blockType ? BLOCK_TYPES[blockType].durability : 0;
          explored[row][col] = row < SURFACE_ROW;              // небо видно сразу, подземелье в тумане
        }
      }
    }

    function generateWorld() {
      generateBlocks()
      generateCaves()
    }

    function createPlayer() {
      player = {
        x: STAR_POSITION_PLAYER.x, y: STAR_POSITION_PLAYER.y, width: PLAYER_WIDTH, height: PLAYER_HEIGHT,
        velocityX: 0, velocityY: 0, onGround: false, facing: 1,
        hp: 100, maxHp: 100, hpRegen: 0.5,
        inventory: [{ kind: 'weapon', family: 'melee', index: 0 }, { kind: 'tool', index: 0 }, ...Array(SLOT_COUNT - 2).fill(null)],
        selectedSlot: 0,
        energy: 15, maxEnergy: 15, energyRegen: 1,
        oxygen: 50, maxOxygen: 50, oxygenRegen: 25, oxygenFreeDepth: 10,
        moveSpeed: 95, jumpPower: 290,
        armor: 0,             // доля снижения урона
        luck: 0,              // бонус очков с блоков
        energySaving: 0,      // доля экономии энергии
        teleportCooldownSec: 35, teleportTimer: 0,
        weaponIndex: 0, toolIndex: 0,
        attackTimer: 0, digTimer: 0, swingAnimTimer: 0
      };
    }

    // Находит слой по глубине. Если глубина больше всех maxDepth, берётся последний слой (у тебя в этом случае был бы undefined и ошибка)
    function findLayerByDepth(layers, depth) {
      return layers.find(layer => depth < layer.maxDepth) || layers.at(-1);
    }

    // Выбор по весам: entries = [[значение, вес], ...]. Веса не обязаны давать в сумме 100, считается доля от общей суммы
    function pickWeighted(entries, roll) {
      const totalWeight = entries.reduce((sum, [, weight]) => sum + weight, 0);
      let value = roll * totalWeight;
      for (const [item, weight] of entries) {
        value -= weight;
        if (value < 0) return item;
      }
      return entries.at(-1)[0];   // на случай ошибок округления
    }

     // ищем все клетки пола в пещерах, перемешиваем
    function generateFloorTiles() {
      for (let col = 0; col < WORLD_WIDTH; col++)
        for (let row = SURFACE_ROW + 5; row < WORLD_HEIGHT - 1; row++)
          if (!blocks[row][col] && blocks[row + 1][col]) floorTiles.push({ col, row });
      floorTiles.sort(() => Math.random() - 0.5);
    }

    // Создаёт слизня на полу клетки (col, row) по параметрам слоя, в котором находится клетка
    function createCaveSlimeAt(col, row) {
      const layer = findLayerByDepth(BIOME_CAVE_ENEMY_LAYERS[current_biome], row - SURFACE_ROW);
      const slimeType = pickWeighted(layer.slimes, Math.random());
      const slime = createEnemy(slimeType, col * TILE_SIZE + TILE_SIZE / 2, (row + 1) * TILE_SIZE, true, layer.hpMultiplier);
      slime.damage = Math.max(1, Math.round(slime.damage * layer.damageMultiplier));
      slime.points = Math.max(1, Math.round(slime.points * layer.pointsMultiplier));
      return slime;
    }

    function spawnCaveSlimes() {
      spawnCaveTargets({
        limit:   CAVE_SLIME_LIMIT,
        layers:  BIOME_CAVE_ENEMY_LAYERS[current_biome],
        createAt:  createCaveSlimeAt,
        targets:  enemies,
      });
    }


    function createChest(chest, x, y) {
      return { x, y, width: chest.width, height: chest.height, points: chest.points, isEnemy: false, hp: chest.hp, maxHp: chest.hp };
    }

    // Создаёт сундук на полу клетки (col, row) по параметрам слоя, в котором находится клетка
    function createCaveChestAt(col, row) {
      const layer = findLayerByDepth(CAVE_CHEST_LAYERS, row - SURFACE_ROW);
      const chest = createChest(layer.chest, col * TILE_SIZE + TILE_SIZE / 2, (row + 1) * TILE_SIZE);
      chest.points =  Math.round(chest.points + (row * 50));
      return chest;
    }

    function spawnCaveChests() {
      spawnCaveTargets({
        limit:   CAVE_CHESTS_LIMIT,
        layers:  CAVE_CHEST_LAYERS,
        createAt:  createCaveChestAt,
        targets:  chests,
      });
    }

    // расставляем таргеты по шансу слоя
    function spawnCaveTargets({ limit, layers, createAt, targets }) {
      let count = 0;
      for (const tile of floorTiles) {
        if (count >= limit) break;
        const layer = findLayerByDepth(layers, tile.row - SURFACE_ROW);
        if (Math.random() < layer.spawnChance) {
          targets.push(createAt(tile.col, tile.row));
          count++;
        }
      }
    }

    function updateCaveRespawn(dt) {
      caveRespawnTimer -= dt;
      if (caveRespawnTimer > 0) return;
      caveRespawnTimer = CAVE_RESPAWN_INTERVAL_SEC;
      if (enemies.filter(e => e.isCaveSlime).length >= CAVE_SLIME_LIMIT) return;
      for (let attempt = 0; attempt < 30; attempt++) {
        const col = Math.floor(Math.random() * WORLD_WIDTH);
        const row = SURFACE_ROW + 5 + Math.floor(Math.random() * (WORLD_HEIGHT - SURFACE_ROW - 6));
        const isFloorTile = !blocks[row][col] && blocks[row + 1][col];
        const distanceToPlayer = Math.hypot(col + 0.5 - playerCenterX() / TILE_SIZE, row + 0.5 - playerCenterY() / TILE_SIZE);
        if (isFloorTile && distanceToPlayer > CAVE_RESPAWN_MIN_DISTANCE) { enemies.push(createCaveSlimeAt(col, row)); return; }
      }
    }

    // Кольцо показывает, какая часть перезарядки прошла; в центре секунды до готовности
    function updateTeleportButton() {
      const remaining = Math.max(0, player.teleportTimer);
      const readyFraction = remaining > 0 ? Math.max(0, Math.min(1, 1 - remaining / player.teleportCooldownSec)) : 1;
      teleportButton.style.setProperty('--ready', readyFraction);
      const label = remaining > 0 ? String(Math.ceil(remaining)) : 'ready';
      if (label !== lastTeleportLabel) {                                  // содержимое меняем только когда оно изменилось
        teleportLabel.innerHTML = remaining > 0 ? Math.ceil(remaining) : TELEPORT_ICON_HTML;
        lastTeleportLabel = label;
      }
    }

    function startNewGame() {
      world = structuredClone(snapshotEmptyWorld);
      current_planet = 'earth';
      current_biome = 'slime_valley';
      main_biome = 'slime_valley';
      createBlockTextures();
      generateWorld();
      createPlayer();
      points = 0;
      upgradeLevels = {};
      baseState = {hp: 500, maxHp: 500, energyRegen: 10, playerHealRate: 10, repairRate: 0, miningRate: 0, turretLevel: 0, maxFuel: 50, fuelRegen: 0.5, fuel: 0};
      miniBaseState = {hp: 500, maxHp: 500, energyRegen: 25, playerHealRate: 12}
      explosions = [];
      floatingTexts = []; turretBeams = [];
      canSummonSlimeBoss = false;
      visibleShopItems = {
        'Персонаж': ['energy', 'energyRegen'],
        'База': ['baseEnergyRegen', 'baseHealRate'],
        'Рассходники': [],
      }
      bossFightActive = false; bossSlimeDead = false; spawnQueue = []; spawnTimer = 0;
      turretTimer = 0; isGameOver = false; messageText = ''; messageTimer = 0;
      isShopOpen = false; shopElement.className = 'h';
      caveRespawnTimer = CAVE_RESPAWN_INTERVAL_SEC;
      generateFloorTiles();
      spawnCaveSlimes();
      spawnCaveChests();
      resetIncomeStats();
      revealAroundPlayer();
    }

    function selectBiome (biome = 'slime_valley') {
      player.x = STAR_POSITION_PLAYER.x, player.y = STAR_POSITION_PLAYER.y;
      
      if (biome == current_biome) return;
      if (!isMainBase) expedition_time_left = 120;

      if (biome == 'slime_valley') {
        current_biome = biome;
        return;
      }
      if (biome == 'sand_dunes') {
        current_biome = biome;
        if (!blocks.length) {
          generateWorld();
          generateFloorTiles();
          spawnCaveSlimes();
        }
        return;
      }
    }

    function backToMainBase() {
      selectBiome(main_biome);
    }
    

    // Открывает клетки вокруг игрока: в пустоте до радиуса REVEAL_RADIUS, за блоками видно только FOG_SOLID_BLOCKS_VISIBLE блоков
    function revealAroundPlayer() {
      const centerCol = playerCenterX() / TILE_SIZE, centerRow = playerCenterY() / TILE_SIZE;
      const rowFrom = Math.max(SURFACE_ROW, Math.floor(centerRow - REVEAL_RADIUS - 1));
      const rowTo = Math.min(WORLD_HEIGHT - 1, Math.ceil(centerRow + REVEAL_RADIUS + 1));
      const colFrom = Math.max(0, Math.floor(centerCol - REVEAL_RADIUS - 1));
      const colTo = Math.min(WORLD_WIDTH - 1, Math.ceil(centerCol + REVEAL_RADIUS + 1));
      for (let row = rowFrom; row <= rowTo; row++)
        for (let col = colFrom; col <= colTo; col++) {
          if (explored[row][col]) continue;
          if (Math.hypot(col + 0.5 - centerCol, row + 0.5 - centerRow) > REVEAL_RADIUS) continue;
          if (countSolidBlocksBetween(centerCol, centerRow, col + 0.5, row + 0.5) < FOG_SOLID_BLOCKS_VISIBLE) explored[row][col] = true;
        }
    }

    /* ====================== 5. ДЕЙСТВИЯ ИГРОКА ====================== */
    function getSelectedItem() { return player.inventory[player.selectedSlot]; }
    function getItemData(item) {
      if (item.kind === 'weapon') return WEAPONS[item.index];
      if (item.kind === 'tool') return TOOLS[item.index];
      if (item.kind === 'dynamite') return DYNAMITE_ITEM;
      return LADDER_ITEM;
    }
    function getItemColor(item) { return getItemData(item).color; }

    // ЛКМ: используем то, что лежит в выбранной ячейке
    function useSelectedItem() {
      const item = getSelectedItem();
      if (!item) return;
      
      if (item.kind === 'weapon' && item.family === 'range') { player.weaponIndex = item.index; playerShoot(); }
      else if (item.kind === 'weapon' && item.family === 'melee') { player.weaponIndex = item.index; playerAttack(); }
      else if (item.kind === 'tool') { player.toolIndex = item.index; playerDig(); }
      else if (item.kind === 'ladder') placeLadder();
      else if (item.kind === 'dynamite') placeDynamite();
      else if (item.kind === 'bossSlime') summonSlimeBoss();
    }

    function ladderAt(col, row) {
      return col >= 0 && col < WORLD_WIDTH && row >= 0 && row < WORLD_HEIGHT && ladders[row][col];
    }

    // Лестницу нужно крепить к твёрдому блоку сбоку или к другой лестнице сверху или снизу
    function hasLadderSupport(col, row) {
      return isSolidTile(col - 1, row) || isSolidTile(col + 1, row) || ladderAt(col, row - 1) || ladderAt(col, row + 1);
    }

    function placeLadder() {
      if (player.digTimer > 0 || isGameOver) return;
      const col = Math.floor(mouse.x / TILE_SIZE), row = Math.floor((mouse.y + cameraY) / TILE_SIZE);
      if (col < 0 || col >= WORLD_WIDTH || row < 0 || row >= WORLD_HEIGHT) return;
      if (blocks[row][col] || ladders[row][col]) return;                                   // клетка занята
      const distance = Math.hypot(col * TILE_SIZE + TILE_SIZE / 2 - playerCenterX(), row * TILE_SIZE + TILE_SIZE / 2 - playerCenterY());
      if (distance > LADDER_REACH_TILES * TILE_SIZE + TILE_SIZE / 2) return;               // слишком далеко
      if (!hasLadderSupport(col, row)) { addFloatingText(playerCenterX(), player.y - 6, 'Лестницу нужно ставить с боку от блока или к другой лестнице ', '#ffe706'); player.digTimer = 0.5; return; }
      ladders[row][col] = true;
      player.digTimer = LADDER_PLACE_COOLDOWN;
      const stack = player.inventory[player.selectedSlot];
      stack.count--;
      if (stack.count <= 0) player.inventory[player.selectedSlot] = null;                  // лестницы кончились — ячейка освобождается
    }

    // Лестница ломается инструментом бесплатно и бесследно (в инвентарь не возвращается)
    function breakLadderAt(col, row) {
      if (!ladders[row][col]) return;
      const tool = TOOLS[player.toolIndex];
      const distance = Math.hypot(col * TILE_SIZE + TILE_SIZE / 2 - playerCenterX(), row * TILE_SIZE + TILE_SIZE / 2 - playerCenterY());
      if (distance > tool.radiusTiles * TILE_SIZE + TILE_SIZE / 2) return;
      ladders[row][col] = false;
      player.digTimer = DIG_COOLDOWN;
    }

    // Тело игрока касается лестницы (проверяется столбец под центром игрока, от головы до клетки под ногами)
    function isPlayerOnLadder() {
      const col = Math.floor(playerCenterX() / TILE_SIZE);
      const topRow = Math.floor(player.y / TILE_SIZE), bottomRow = Math.floor((player.y + player.height) / TILE_SIZE);
      for (let row = topRow; row <= bottomRow; row++) if (ladderAt(col, row)) return true;
      return false;
    }

    function summonSlimeBoss() {
      if (player.digTimer > 0 || isGameOver) return;
      const stack = player.inventory[player.selectedSlot];
      stack.count--;
      if (stack.count <= 0) player.inventory[player.selectedSlot] = null;
      startBossFight();
      startWave();
    }

    function getDynamiteStats() { return DYNAMITE_LEVELS[upgradeLevels.dynamite || 0]; }

    // ЛКМ с динамитом: ставим в пустую клетку; динамит падает вниз до ближайшего твёрдого блока
    function placeDynamite() {
      if (player.digTimer > 0 || isGameOver) return;
      const col = Math.floor(mouse.x / TILE_SIZE), row = Math.floor((mouse.y + cameraY) / TILE_SIZE);
      if (col < 0 || col >= WORLD_WIDTH || row < 0 || row >= WORLD_HEIGHT || blocks[row][col]) return;
      const distance = Math.hypot(col * TILE_SIZE + TILE_SIZE / 2 - playerCenterX(), row * TILE_SIZE + TILE_SIZE / 2 - playerCenterY());
      if (distance > DYNAMITE_REACH_TILES * TILE_SIZE + TILE_SIZE / 2) return;
      let landingRow = row;
      while (landingRow + 1 < WORLD_HEIGHT && !blocks[landingRow + 1][col]) landingRow++;
      dynamites.push({ col, row: landingRow, timer: DYNAMITE_FUSE_SEC });
      player.digTimer = DYNAMITE_PLACE_COOLDOWN;
      const stack = player.inventory[player.selectedSlot];
      stack.count--;
      if (stack.count <= 0) player.inventory[player.selectedSlot] = null;
    }
    function explodeDynamite(col, row) {
      const stats = getDynamiteStats();
      const centerX = col * TILE_SIZE + TILE_SIZE / 2, centerY = row * TILE_SIZE + TILE_SIZE / 2;
      const radiusPx = DYNAMITE_RADIUS_TILES * TILE_SIZE, reach = Math.ceil(DYNAMITE_RADIUS_TILES);

      // Блоки: рвутся только те, чей уровень не выше уровня динамита. Лестницы в радиусе ломаются всегда
      let totalReward = 0;
      for (let r = row - reach; r <= row + reach; r++)
        for (let c = col - reach; c <= col + reach; c++) {
          if (c < 0 || c >= WORLD_WIDTH || r < 0 || r >= WORLD_HEIGHT - 1) continue;      // нижний слой мира не взрывается
          if (Math.hypot(c * TILE_SIZE + TILE_SIZE / 2 - centerX, r * TILE_SIZE + TILE_SIZE / 2 - centerY) > radiusPx) continue;
          ladders[r][c] = false;
          const blockType = blocks[r][c];
          if (!blockType || BLOCK_TYPES[blockType].level > stats.maxBlockLevel) continue;
          blocks[r][c] = 0;
          blockDurability[r][c] = 0;
          totalReward += BLOCK_TYPES[blockType].points * (1 + player.luck);
        }
      playDynamiteExplosion();
      totalReward = Math.round(totalReward);
      if (totalReward > 0) { earnPoints(totalReward); addFloatingText(centerX, centerY - 10, '+' + totalReward, '#f5c542'); }

      // Существа: урон в центре 100%, на краю радиуса 50%
      const damageAt = distance => Math.max(1, Math.round(stats.damage * (1 - 0.5 * distance / radiusPx)));
      for (const enemy of [...enemies]) {                                                  // копия списка: damageTarget удаляет убитых
        const distance = Math.hypot(enemy.x - centerX, (enemy.y - 5) - centerY);
        if (distance <= radiusPx) damageTarget(enemy, damageAt(distance));
      }
      const playerDistance = Math.hypot(playerCenterX() - centerX, playerCenterY() - centerY);
      if (playerDistance <= radiusPx) damagePlayer(damageAt(playerDistance));              // броня игрока снижает урон

      explosions.push({ x: centerX, y: centerY, radius: radiusPx, timer: EXPLOSION_ANIM_SEC });
    }

    // Работа со стопкой в инвентаре
    function findStackSlot(kind) { return player.inventory.findIndex(slot => slot && slot.kind === kind); }
    function countStack(kind) { const i = findStackSlot(kind); return i === -1 ? 0 : player.inventory[i].count; }
    function addToStack(kind, amount) {
      let i = findStackSlot(kind);
      if (i === -1) { i = player.inventory.indexOf(null); player.inventory[i] = { kind, count: 0 }; }
      player.inventory[i].count += amount;
    }

    // Что случится при покупке: 'owned' (уже есть), 'obsolete' (есть лучше того же семейства),
    // 'replace' (заменит слабый), 'add' (в пустую ячейку), 'full' (нет места)
    function getInventoryStatus(kind, index) {
      const newItem = getItemData({ kind, index });
      for (const slot of player.inventory) {
        if (!slot || slot.kind !== kind) continue;
        const ownedItem = getItemData(slot);
        if (ownedItem.family !== newItem.family) continue;
        return slot.index === index ? 'owned' : ownedItem.tier > newItem.tier ? 'obsolete' : 'replace';
      }
      return player.inventory.includes(null) ? 'add' : 'full';
    }

    function addItemToInventory(kind, index) {
      const family = getItemData({ kind, index }).family;
      let slotIndex = player.inventory.findIndex(slot => slot && slot.kind === kind && getItemData(slot).family === family);
      if (slotIndex === -1) slotIndex = player.inventory.indexOf(null);
      if (slotIndex !== -1) player.inventory[slotIndex] = { kind, index, family };
    }

    function teleportToBase() {
      if (isGameOver) return;
      if (player.teleportTimer > 0) {addFloatingText(playerCenterX(), player.y - 6, 'Телепорт перезаряжается ' + Math.ceil(player.teleportTimer) + 'с', '#ffe706'); return;}
      player.x = BASE_CENTER_X - player.width / 2;
      player.y = GROUND_Y - player.height;
      player.velocityX = player.velocityY = 0;
      player.teleportTimer = player.teleportCooldownSec;
    }

    function toggleShop() {
      if (isGameOver) return;
      if (isShopOpen) {isShopOpen = false; shopElement.className = 'h'; return;}
      if (!isPlayerInBaseZone()) {showMessage('Магазин открывается в зоне базы'); return;}
      if (waveActive || bossFightActive) {showMessage('Магазин закрыт во время волны!');return;}
      if (!isMainBase) shopTab = 'База';
      isShopOpen = true; shopElement.className = ''; renderShop(true); 
    }

    function damagePlayer(amount) {
      const finalDamage = amount * (1 - player.armor);
      player.hp -= finalDamage;
      playTargetHit();
      addFloatingText(playerCenterX(), player.y - 6, '-' + (+finalDamage.toFixed(1)), '#ff5555');
    }

    function damageTarget(target, amount) {
      target.hp -= amount;
      playTargetHit();
      if (target.isEnemy) target.hurtTimer = 0.12;
      addFloatingText(target.x, target.y - 22, '-' + amount, '#fff');
  
      if (target.hp <= 0) {
        earnPoints(target.points);
        addFloatingText(target.x, target.y - 32, '+' + target.points, '#f5c542');
        const targets = target.isEnemy ? enemies : chests;
        targets.splice(targets.indexOf(target), 1);
      }
    }

    function findClosestTarget(list, cx, cy, weapon) {
      let best = null, bestDist = Infinity;
      for (const obj of list) {
        const distance = Math.hypot(obj.x - cx, (obj.y - obj.height / 2) - cy);
        const inRange = distance <= weapon.radiusTiles * TILE_SIZE + obj.width / 2;
        const onCursorSide = Math.sign(obj.x - cx) === Math.sign(mouse.x - cx) || Math.abs(obj.x - cx) < obj.weight / 2;
        if (inRange && onCursorSide && distance < bestDist) {
          best = obj;
          bestDist = distance;
        }
      }
      return { target: best, distance: bestDist };
    }

    // ЛКМ: удар по ближайшему врагу в сторону курсора (энергия тратится только при попадании)
    function playerAttack() {
      if (player.attackTimer > 0 || isGameOver) return;
      const weapon = WEAPONS[player.weaponIndex];
      const energyCost = weapon.energyCost * (1 - player.energySaving);
      const cx = playerCenterX(), cy = playerCenterY();
      const enemyHit = findClosestTarget(enemies, cx, cy, weapon);
      const chestHit = findClosestTarget(chests,  cx, cy, weapon);
      let target;
      const hit = enemyHit.distance <= chestHit.distance ? enemyHit : chestHit;
      if (!hit.target) return;

      if (player.energy < energyCost) {addFloatingText(playerCenterX(), player.y - 6, 'Нет энергии для удара', '#ffe706'); player.attackTimer = 0.3; return;}
      player.energy -= energyCost;
      player.attackTimer = weapon.cooldown;
      player.swingAnimTimer = 0.15;
      player.facing = hit.target.x >= cx ? 1 : -1; // поварачивается в сторону врага перед ударом
      damageTarget(hit.target, weapon.damage);
    }

    function playerShoot() {
      if (player.attackTimer > 0 || isGameOver) return;
      const weapon = WEAPONS[player.weaponIndex];
      const energyCost = weapon.energyCost * (1 - player.energySaving);

      if (player.energy < energyCost) {addFloatingText(playerCenterX(), player.y - 6, 'Нет энергии для выстрела', '#ffe706'); player.attackTimer = 0.3; return;}
      player.energy -= energyCost;
      player.attackTimer = weapon.cooldown;
      player.swingAnimTimer = 0.15;
      player.facing = mouse.x >= playerCenterX() ? 1 : -1;

      playBowShot();
      createProjectile(weapon);
    }

    function createProjectile(weapon) {
      const cx = playerCenterX(); 
      const cy = playerCenterY();
      
      const dx = mouse.x - cx;
      const dy = (mouse.y + cameraY) - cy;
      const angle = Math.atan2(dy, dx);

      const speed = 500;

      let projectile = {
        x: cx, 
        y: cy, 
        vx: Math.cos(angle) * speed, 
        vy: Math.sin(angle) * speed, 
        angle: angle, 
        distanceTraveled: 0,
        maxDistance: 1000,
        damage: weapon.damage,

      };

      projectiles.push(projectile);
    }

    function isProjectileHit(target, projectile) {
      const arrowSize = 8;
      const rect = getEnemyRect(target);

      return projectile.x + arrowSize > rect.left &&
            projectile.x - arrowSize < rect.left + rect.width &&
            projectile.y + arrowSize > rect.top &&
            projectile.y - arrowSize < rect.top + rect.height;
    }

    function projectileMovement(arrow, dt) {
      arrow.vy += (GRAVITY - 600) * dt;
      arrow.x += arrow.vx * dt;
      arrow.y += arrow.vy * dt;
      arrow.angle = Math.atan2(arrow.vy, arrow.vx);
      arrow.distanceTraveled += Math.hypot(arrow.vx, arrow.vy) * dt;
    }

    function isHitprojectileBlocks(arrow) {
      const col = Math.floor(arrow.x / TILE_SIZE);
      const row = Math.floor(arrow.y / TILE_SIZE);

      // Проверяем границы мира и то, является ли блок твердым
      if (row < 0 || row >= WORLD_HEIGHT || col < 0 || col >= WORLD_WIDTH) return true;
      const blockType = blocks[row][col];
      
      if (blockType !== 0) { // Если это не воздух
        playTargetHit();

        return true;
      }
    }

    function isHitprojectileTargets(arrow) {
      for (let j = enemies.length - 1; j >= 0; j--) {
        const enemy = enemies[j]; 
        
        if (isProjectileHit(enemy, arrow)) {
          damageTarget(enemy, arrow.damage);

          return true;
        }
      }
    }

    function updateProjectile(dt) {
      for (let i = projectiles.length - 1; i >= 0; i--) {
        let arrow = projectiles[i];

        projectileMovement(arrow, dt);
      
        let hasHit = false;
        hasHit = isHitprojectileBlocks(arrow)
      
        // Проверяем врагов только если не попали в блок
        if (!hasHit) hasHit = isHitprojectileTargets(arrow);
        // Удаляем стрелу, если она во что-то попала или улетела далеко
        if (hasHit || arrow.distanceTraveled > arrow.maxDistance) {
          projectiles.splice(i, 1);
        }
      }
    }

    // ПКМ: удар инструментом по блоку под курсором
    function playerDig() {
      if (player.digTimer > 0 || isGameOver) return;
      const col = Math.floor(mouse.x / TILE_SIZE), row = Math.floor((mouse.y + cameraY) / TILE_SIZE);
      if (col < 0 || col >= WORLD_WIDTH || row < 0 || row >= WORLD_HEIGHT) return;
      if (!blocks[row][col]) { breakLadderAt(col, row); return; }   // в клетке нет блока: возможно, там лестница
      const tool = TOOLS[player.toolIndex];
      const energyCost = tool.energyCost * (1 - player.energySaving);
      const distance = Math.hypot(col * TILE_SIZE + TILE_SIZE / 2 - playerCenterX(), row * TILE_SIZE + TILE_SIZE / 2 - playerCenterY());
      if (distance > tool.radiusTiles * TILE_SIZE + TILE_SIZE / 2) return;     // слишком далеко
      const blockType = BLOCK_TYPES[blocks[row][col]];
      if (tool.level < blockType.level) {addFloatingText(playerCenterX(), player.y - 6, 'Нужен инструмент уровня ' + blockType.level + ' для блока «' + blockType.name + '»', '#ffe706'); player.digTimer = 0.5; return;}
      if (player.energy < energyCost) {addFloatingText(playerCenterX(), player.y - 6, 'Нет энергии! Отдохни на базе', '#ffe706'); player.digTimer = 0.5; return;}
      player.energy -= energyCost;
      player.digTimer = DIG_COOLDOWN;
      blockDurability[row][col] -= tool.power;
      if (blockDurability[row][col] <= 0) {
        if (blocks[row][col] === 8) canSummonSlimeBoss = true; 
        const reward = Math.max(1, Math.round(blockType.points * (1 + player.luck)));
        earnPoints(reward);
        playBlockBreak();
        addFloatingText(col * TILE_SIZE + TILE_SIZE / 2, row * TILE_SIZE, '+' + reward, '#f5c542');
        blocks[row][col] = 0;
      }
    }

    // Ходьба, прыжок, гравитация и столкновения с блоками
    function updatePlayerMovement(dt) {
      const direction = (keysDown.KeyD || keysDown.ArrowRight ? 1 : 0) - (keysDown.KeyA || keysDown.ArrowLeft ? 1 : 0);
      player.velocityX = direction * player.moveSpeed;
      if (direction) player.facing = direction;
      const onLadder = isPlayerOnLadder();
      if (!onLadder && (keysDown.KeyW || keysDown.ArrowUp || keysDown.Space) && player.onGround) { player.velocityY = -player.jumpPower; player.onGround = false; }
      if (onLadder) {
        // на лестнице гравитации нет: W вверх, S вниз, без нажатия игрок висит (стрелки не работают)
        player.velocityY = ((keysDown.KeyS ? 1 : 0) - (keysDown.KeyW ? 1 : 0)) * LADDER_CLIMB_SPEED;
      } else {
        player.velocityY = Math.min(MAX_FALL_SPEED, player.velocityY + GRAVITY * dt);
      }

      let newX = player.x + player.velocityX * dt;
      newX = Math.max(0, Math.min(WORLD_WIDTH * TILE_SIZE - player.width, newX));
      if (!boxHitsBlocks(newX, player.y, player.width, player.height)) player.x = newX;

      const newY = player.y + player.velocityY * dt;
      player.onGround = false;
      if (!boxHitsBlocks(player.x, newY, player.width, player.height)) {
        player.y = newY;
      } else {
        if (player.velocityY > 0) {player.onGround = true; player.y = Math.floor((newY + player.height) / TILE_SIZE) * TILE_SIZE - player.height;}
        else player.y = Math.floor(newY / TILE_SIZE + 1) * TILE_SIZE;
        player.velocityY = 0;
      }
    }

    /* ========================== 6. ВРАГИ И ВОЛНЫ ========================== */

    // y врага — координата его "ног"
    function createEnemy(slimeTypeIndex, x, y, isCaveSlime, hpMultiplier = 1) {
      const type = ENEMY_TYPES[slimeTypeIndex];
      const hp = Math.round(type.hp * hpMultiplier);
      return {
        x, y, width: type.width, height: type.height, isCaveSlime, isEnemy: true, hp, maxHp: hp, damage: type.damage, shadeColor: type.shadeColor, color: type.color,  speed: type.speed,
        points: type.points, attackTimer: 0, hurtTimer: 0, velocityY: 0, direction: Math.random() < 0.5 ? 1 : -1, isBoss: type.kind === 'slimeBoss', kind: type.kind
      };
    }

    // Сколько [зелёных, синих, желтых] слизней в волне
    function getWaveEnemyCounts(wave) {
      const count_enemies = {
          slime_valley: {
            1: [5, 0, 0], 2: [10, 0, 0], 3: [13, 2, 0],
            4: [15, 5, 0], 5: [20, 10, 1], 6: [25, 15, 3],
            7: [25, 20, 6]
          },

          sand_dunes: {
            1: [0, 10, 10, 0, 5], 2: [15, 15, 7], 3: [25, 20, 10],
            4: [25, 30, 12], 5: [30, 30, 15], 6: [10, 45, 18],
            7: [0, 70, 25]
          },

      };

      if (bossFightActive) return [0, 0, 15]
      if (count_enemies[current_biome][wave]) return count_enemies[current_biome][wave];

      const extra  = wave - 7;

      const green_slimes_count = Math.round(25 + 3  * Math.pow(extra , 1.1));
      const blue_slimes_count = Math.round(20 + 4  * Math.pow(extra , 1.15));
      const yellow_slimes_count = Math.round(6  + 1.5 * Math.pow(extra , 1.5));

      return [green_slimes_count, blue_slimes_count, yellow_slimes_count];
    }

    function getWaveBonus(wave) {
      const bonuses = {
        slime_valley: {1: 90, 2: 180, 3: 400, 4: 800, 5: 1500, 6: 2200, 7: 2800, 8: 3500, 9: 4200, 10: 5000 },
        sand_dunes: {1: 10000, 2: 15000, 3: 20000, 4: 25000, 5: 30000, 6: 40000, 7: 50000, 8: 70000, 9: 80000, 10: 100000}
      }
      if (bonuses[current_biome][wave]) {
        return bonuses[current_biome][wave]
      }
      
      return  1000 * (wave - 3)
    }

    function startWave() {
      waveNumber++;
      waveActive = true;
    
      const enemyCounts = [...getWaveEnemyCounts(waveNumber)];
      spawnQueue = [];
      for (let i = 0; i < enemyCounts.length; i++) {
        const count = enemyCounts[i];
        for (let j = 0; j < count; j++) spawnQueue.push(i);
      }
      
      spawnQueue.sort(() => Math.random() - 0.5);
      spawnTimer = 0;

      let text = bossFightActive ? 'Босс слайм пробудился.' : 'Волна ' + waveNumber;
      showMessage(text + '! Защити базу!');
    }

    function startBossFight() {
      bossFightActive = true;
      const boss_delay_width = 100;

      ENEMY_TYPES[BOSS_SLIME].width

      spawnQueue = [];
      spawnQueue.push(BOSS_SLIME);
      const fromLeft = Math.random() < 0.5;
      enemies.push(createEnemy(
        spawnQueue.pop(),
        fromLeft ? - (ENEMY_TYPES[BOSS_SLIME].width / 2) - boss_delay_width : WORLD_WIDTH * TILE_SIZE + (ENEMY_TYPES[BOSS_SLIME].width / 2) + boss_delay_width,
        GROUND_Y,
        false
      ))
    }

    function spawnWaveEnemy() {
      const hpMultiplier = 1 + 0.1 * Math.max(0, waveNumber - 3);        // с 4-й волны слизни крепчают
      const fromLeft = Math.random() < 0.5;
      const indexEnemy = spawnQueue.pop();
      enemies.push(createEnemy(indexEnemy, fromLeft ? - ENEMY_TYPES[indexEnemy].width / 2 : WORLD_WIDTH * TILE_SIZE + ENEMY_TYPES[indexEnemy].width / 2, ENEMY_TYPES[indexEnemy].kind === 'bat' ? GROUND_Y - 100 :GROUND_Y, false, hpMultiplier));
    }

    function countWaveEnemiesLeft() {return enemies.filter(e => !e.isCaveSlime).length;}
    function deleteWaveEnemies() {enemies = enemies.filter(e => e.isCaveSlime)}

    function updateWaves(dt) {
      if (!waveActive) {
        waveTimer -= dt;
        if (waveTimer <= 0) startWave();
        return;
      }
      spawnTimer -= dt;
      if (spawnQueue.length && spawnTimer <= 0) {spawnWaveEnemy(); spawnTimer = SPAWN_INTERVAL_SEC;}
      if (!spawnQueue.length && countWaveEnemiesLeft() === 0) {           // волна отбита
        waveActive = false;
        waveTimer = Math.min(waveNumber + 3, MAX_WAVE_DELAY_MIN) * 60;    // 4, 5, 6...
        const bonus = getWaveBonus(waveNumber);
        points += bonus;
        logWaveCleared(waveNumber);
        showMessage('Волна ' + waveNumber + ' отбита! Награда +' + bonus);
      }
    }

    function updateBossFight() {
      if (!bossFightActive) return;

      if (!spawnQueue.length && countWaveEnemiesLeft() === 0) {           // босс погиб
        bossFightActive = false;
        bossSlimeDead = true;
        showMessage('Босс побежден!');
      }
    }

    // Пещерный слизень: патрулирует, при приближении игрока преследует, подчиняется гравитации
    function updateCaveSlime(slime, dt) {
      const isOnGround = slime.velocityY === 0;
      const dx = playerCenterX() - slime.x, dy = playerCenterY() - (slime.y - slime.height / 2);
      const isChasing = Math.hypot(dx, dy) < CAVE_SLIME_CHASE_DISTANCE;
      if (isChasing && Math.abs(dx) > 6) slime.direction = Math.sign(dx);
      const nextX = slime.x + slime.direction * slime.speed * dt;
      const hitsWall = boxHitsBlocks(nextX - slime.width / 2, slime.y - slime.height, slime.width, slime.height);
      const ledgeAhead = !isSolidTile(Math.floor((nextX + slime.direction * slime.width / 2) / TILE_SIZE), Math.floor((slime.y + 1) / TILE_SIZE));
      if (hitsWall || (ledgeAhead && !isChasing)) {
        if (!isChasing) slime.direction *= -1;
        else if (hitsWall && isOnGround) {
          // препятствие не выше 2 блоков: над ним (на высоте 2 блоков) место свободно
          const canStepUp = !boxHitsBlocks(nextX - slime.width / 2, slime.y - slime.height - SLIME_MAX_STEP_BLOCKS * TILE_SIZE, slime.width, slime.height);
          if (canStepUp) slime.velocityY = -SLIME_JUMP_POWER;
        }
      }
      else slime.x = nextX;
      slime.velocityY += GRAVITY * dt;
      const nextY = slime.y + slime.velocityY * dt;
      if (slime.velocityY > 0 && boxHitsBlocks(slime.x - slime.width / 2, nextY - slime.height, slime.width, slime.height)) {slime.y = Math.floor(nextY / TILE_SIZE) * TILE_SIZE; slime.velocityY = 0;}
      else slime.y = nextY;
      if (Math.abs(dx) < slime.width / 2 + player.width / 2 && Math.abs(dy) < slime.height / 2 + player.height / 2 && slime.attackTimer <= 0) {
        slime.attackTimer = 1;
        damagePlayer(slime.damage);
      }
    }

    // Слизень волны: идёт к базе, а если игрок на поверхности рядом — к нему
    function updateWaveSlime(slime, dt) {
      const playerNearby = isPlayerOnSurface() && Math.abs(slime.x - playerCenterX()) < SLIME_CHASE_DISTANCE;
      const baseIsOnRight = slime.x < BASE_CENTER_X;
      const targetX = playerNearby ? playerCenterX() : (baseIsOnRight ? BASE_LEFT - slime.width / 2 : BASE_LEFT + BASE_WIDTH + slime.width / 2);
      const reachedTarget = playerNearby ? Math.abs(slime.x - playerCenterX()) < (slime.width / 2) + (player.width / 2) : (baseIsOnRight ? slime.x >= BASE_LEFT - slime.width / 2 : slime.x <= BASE_LEFT + BASE_WIDTH + slime.width / 2);
      if (!reachedTarget) {slime.x += Math.sign(targetX - slime.x) * slime.speed * dt; return;}
      if (slime.attackTimer > 0) return;
      slime.attackTimer = 1;
      if (playerNearby) damagePlayer(slime.damage); else (isMainBase ? baseState.hp -= slime.damage : miniBaseState.hp -= slime.damage);
    }

    function updateEnemies(dt) {
      for (const enemy of enemies) {
        enemy.attackTimer -= dt;
        enemy.hurtTimer -= dt;
        if (enemy.isCaveSlime) updateCaveSlime(enemy, dt); else updateWaveSlime(enemy, dt);
      }
    }

    // Орудие базы стреляет по ближайшему наземному врагу
    function updateTurret(dt) {
      if (!isMainBase) return;
  
      turretTimer -= dt;
      if (baseState.turretLevel && turretTimer <= 0) {
        let target = null, targetDistance = Infinity;
        for (const enemy of enemies) {
          if (enemy.isCaveSlime) continue;
          const distance = Math.abs(enemy.x - BASE_CENTER_X);
          if (distance < BASE_WIDTH / 2 + TURRET_RANGE && distance < targetDistance) {target = enemy; targetDistance = distance;}
        }
        if (target) {
          const level = TURRET_LEVELS[baseState.turretLevel];
          turretTimer = level.cooldown;
          turretBeams.push({x1: BASE_CENTER_X, y1: BASE_TOP - 30, x2: target.x, y2: target.y - 6, timer: 0.12});
          damageTarget(target, level.damage);
        }
      }
      for (let i = turretBeams.length - 1; i >= 0; i--) {
        turretBeams[i].timer -= dt;
        if (turretBeams[i].timer <= 0) turretBeams.splice(i, 1);
      }
    }

    function updateRegeneration(dt) {
      updatePlayerEnergy(dt);
      updatePlayerHealth(dt);
    }

    function updatePlayerEnergy(dt) {
      const inBase = isPlayerInBaseZone();
      let rate = player.energyRegen;
      
      if (inBase) {
        rate = isMainBase ? baseState.energyRegen : miniBaseState.energyRegen
      }

      player.energy = Math.min(player.maxEnergy, player.energy + rate * dt)
    }

    function updatePlayerHealth(dt) {
      const inBase = isPlayerInBaseZone();
      let rate = player.hpRegen;

      if (inBase) {
        rate = isMainBase ? baseState.playerHealRate : miniBaseState.playerHealRate
      }

      player.hp = Math.min(player.maxHp, player.hp + rate * dt);
    }

    function updateBaseRepair(dt) {
      if (baseState.repairRate && baseState.hp > 0) {
        baseState.hp = Math.min(baseState.maxHp, baseState.hp + baseState.repairRate * dt);
      }
    }

    

    function updateOxygen(dt) {
      const NoOxygenMultiplyDamage = 5
      const depth = getDepthPlayer();
      const layer = BIOME_BLOCK_LAYERS[current_biome].find(layer => depth < layer.maxDepth);
      if (depth <= player.oxygenFreeDepth) {
        player.oxygen = Math.min(player.maxOxygen, player.oxygen) + (player.oxygenRegen * dt); return  
      } else {
        if (player.oxygen >= 0) {
          player.oxygen -= layer.oxygenCost * dt;
        } else {
          player.hp -= (layer.oxygenCost * dt) * NoOxygenMultiplyDamage;
        }
      }

    }

    function updateDynamites(dt) {
      for (let i = dynamites.length - 1; i >= 0; i--) {
        dynamites[i].timer -= dt;
        if (dynamites[i].timer <= 0) { const dynamite = dynamites.splice(i, 1)[0]; explodeDynamite(dynamite.col, dynamite.row); }
      }
      for (let i = explosions.length - 1; i >= 0; i--) {
        explosions[i].timer -= dt;
        if (explosions[i].timer <= 0) explosions.splice(i, 1);
      }
    }

    function updateMiningBase(dt) {
      if (baseState.miningRate <= 0) return;
      earnPoints(baseState.miningRate * dt);
    }

    function updateMinibase() {
      if (isMainBase) return;
      if (miniBaseState.hp <= 0) {
        waveNumber--;
        waveActive = false;
        spawnQueue = [];
        waveTimer = waveNumber === 0 ? FIRST_WAVE_DELAY_SEC :  Math.min(waveNumber + 3, MAX_WAVE_DELAY_MIN) * 60;
        deleteWaveEnemies();
        backToMainBase();
        showMessage('Базу экспедиции сломали!');
        expedition_time_left = 120;
      }
    }

    function updateExpeditionTime(dt) {
      if (isMainBase) return;
      if (waveActive) return;
      expedition_time_left -= dt;
      if (expedition_time_left <= 0) {
        expedition_time_left = 120;
        backToMainBase();
        showMessage('Время экспедиции закончилось!');
      }
    }

    function updateFuel(dt) {
      if (!bossSlimeDead) return;
      if (!isMainBase) return;
      if (baseState.fuel >= baseState.maxFuel) return;
      baseState.fuel += baseState.fuelRegen * dt;
    }

    function checkDefeat() {
      if (baseState.hp <= 0) {baseState.hp = 0; isGameOver = true; isShopOpen = false; shopElement.className = 'h';}
      if (player.hp <= 0) {                                       // смерть игрока: телепорт и минус половина очков
        points = Math.floor(points / 2);
        player.hp = player.maxHp;
        player.teleportTimer = 0;
        teleportToBase();
        showMessage('Ты погиб! Потеряна половина очков');
      }
    }

    function updateFloatingTexts(dt) {
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        floatingTexts[i].timer -= dt;
        floatingTexts[i].y -= 20 * dt;
        if (floatingTexts[i].timer <= 0) floatingTexts.splice(i, 1);
      }
    }

    function updateClouds(dt) {
      for (const cloud of clouds) {
        cloud.x += cloud.speed * dt;
        // ушло за правый край — вернулось слева
        if (cloud.x > CANVAS_WIDTH + 100) {
          cloud.x = -100;
        }
      }
    }

    function updateUi() {
      document.getElementById('dirtButton').classList.toggle('hidden', !bossSlimeDead); 
    }

    function updateGame(dt) {
      player.attackTimer -= dt; player.digTimer -= dt; player.teleportTimer -= dt; player.swingAnimTimer -= dt;
      messageTimer -= dt;
      managerDisplayShopItems();
      updateClouds(dt);
      updatePlayerMovement(dt);
      cameraY = Math.max(0, Math.min(WORLD_HEIGHT * TILE_SIZE - CANVAS_HEIGHT, playerCenterY() - CANVAS_HEIGHT / 2));
      updateUi();
      revealAroundPlayer();
      if (mouse.leftDown) useSelectedItem();
      updateRegeneration(dt);
      updateBaseRepair(dt);
      updateOxygen(dt);
      updateMiningBase(dt);
      updateTurret(dt);
      updateCaveRespawn(dt);
      updateWaves(dt);
      updateBossFight();
      updateIncomeStats(dt);
      updateExpeditionTime(dt);
      updateProjectile(dt)
      updateEnemies(dt);
      updateDynamites(dt);
      checkDefeat();
      updateMinibase(dt);
      updateFuel(dt);
      updateFloatingTexts(dt);
      updateTeleportButton();
    }

    /* ======================= 9. МАГАЗИН И ИНТЕРФЕЙС ======================= */
  
    function showToast(message, { duration = 5000, type = 'info' } = {}) {
      const container = document.getElementById('toast-container');

      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = "Новое улучшение: " + message;

      container.appendChild(toast);

      // Небольшая задержка, чтобы браузер успел применить начальные стили
      // и анимация выезда сработала корректно
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          toast.classList.add('show');
        });
      });

      // Скрытие
      setTimeout(() => {
        toast.classList.remove('show');
        toast.classList.add('hide');

        // Удаляем из DOM после завершения анимации
        toast.addEventListener('transitionend', () => toast.remove(), { once: true });
      }, duration);
    }


    function buildShopItem(category, key) {
      if (category === 'Расходники') {
        switch (key) {
          case 'ladder':           return buildLadderShopItem();
          case 'dynamite':         return buildDynamiteShopItem();
          case 'bossSlime':        return buildBossSlimeShopItem();
          case 'dynamiteUpgrade': return buildUpgradeItem('dynamite');
        }
      }

      // Апгрейды персонажа / базы — везде UPGRADES[key]
      if (UPGRADES[key]) return buildUpgradeItem(key);

      return null;
    }



    // Одна строка улучшения-лестницы: следующая ступень или «максимум»
    function buildUpgradeItem(upgradeKey) {
      const upgrade = UPGRADES[upgradeKey], level = upgradeLevels[upgradeKey] || 0, step = upgrade.steps[level];
      if (!step) return {title: upgrade.title, description: upgrade.describe() + ' · максимум', state: 'max'};
      const [cost, newValue] = step;
      return {
        title: upgrade.title + ' → ' + upgrade.format(newValue), description: upgrade.describe(), cost, state: 'buy',
        onBuy: () => {upgrade.apply(newValue); upgradeLevels[upgradeKey] = level + 1;}
      };
    }

    function buildInventoryShopItem(kind, index, title, description, cost) {
      const status = getInventoryStatus(kind, index);
      const note = { owned: '', add: '', replace: ' · заменит текущий', obsolete: ' · есть лучше', full: ' · нет места в инвентаре' }[status];
      const state = status === 'owned' ? 'equipped' : (status === 'obsolete' || status === 'full') ? 'max' : 'buy';
      return { title, description: description + note, cost, state, onBuy: () => addItemToInventory(kind, index) };
    }

    function buildUpgradeShopItems(kind, items, getInfo) {
      const result = [];
      const seen = new Set();   // семейства, для которых предмет уже найден

      for (let item_index = 0; item_index < items.length; item_index++) {
        const family = items[item_index].family;
        if (seen.has(family)) continue;

        const status = getInventoryStatus(kind, item_index);
        if (status === 'owned' || status === 'obsolete') continue;

        seen.add(family);
        const info = getInfo(items[item_index]);
        result.push(buildInventoryShopItem(kind, item_index, info.title, info.description, info.cost));
      }

      // выкуплено всё на вкладке
      if (result.length === 0) {
        return [{ title: 'Всё куплено', description: 'Больше нечего покупать', cost: 0, state: 'max', onBuy: () => {} }];
      }
      return result;
    }

    function buildStackShopItem(kind, title, description, packSize, price, stackLimit) {
      const owned = countStack(kind);
      const hasSlot = findStackSlot(kind) !== -1 || player.inventory.includes(null);
      const stackFull = owned + packSize > stackLimit;
      const note = stackFull ? ' · стопка полная' : !hasSlot ? ' · нет места в инвентаре' : '';
      return { title, description: description + ' · у тебя: ' + owned + '/' + stackLimit + note, cost: price,
              state: stackFull || !hasSlot ? 'max' : 'buy', onBuy: () => addToStack(kind, packSize) };
    }

    function buildLadderShopItem() {
      return buildStackShopItem('ladder', 'Лестницы ×' + LADDER_PACK_SIZE, 'Ставить у опоры', LADDER_PACK_SIZE, LADDER_PACK_PRICE, LADDER_STACK_LIMIT);
    }

    function buildDynamiteShopItem() {
      const stats = getDynamiteStats();
      return buildStackShopItem('dynamite', 'Динамит ×' + DYNAMITE_PACK_SIZE,
        'Ломает руду до ур. ' + stats.maxBlockLevel + ' · урон ' + stats.damage,
        DYNAMITE_PACK_SIZE, stats.packPrice, DYNAMITE_STACK_LIMIT);
    }

    function buildBossSlimeShopItem() {
      return buildStackShopItem('bossSlime', 'Приманка для босса', 'Призывает босса слайма. Подготовься!', BOSS_PACK_SIZE, BOSS_PACK_PRICE, BOSS_STACK_LIMIT)
    }

    // Список товаров текущей вкладки. state: 'buy' (купить), 'own' (куплено, можно взять), 'equipped', 'max'
    function getShopItems() {
      if (shopTab === 'Расходники') {
        const keys = visibleShopItems[shopTab] || [];
        return keys.map(key => buildShopItem(shopTab, key)).filter(Boolean);
      }
      if (shopTab === 'Оружие') return buildUpgradeShopItems('weapon', WEAPONS, w => ({
        title: w.name,
        description: 'Урон ' + w.damage + ' · 1 удар/' + w.cooldown + 'с · энергия ' + w.energyCost + ' · радиус ' + w.radiusTiles + ' бл.',
        cost: w.cost
      }));
      if (shopTab === 'Инструменты') return buildUpgradeShopItems('tool', TOOLS, t => ({
        title: t.name,
        description: 'Уровень ' + t.level + ' · копание ' + t.power + ' ед. · энергия ' + t.energyCost + ' · радиус ' + t.radiusTiles + ' бл.',
        cost: t.cost
      }));
      const items = visibleShopItems[shopTab].map(buildUpgradeItem);
      if (shopTab === 'База') {
        if (isMainBase) {
          const repairItem = baseState.hp < baseState.maxHp
            ? {title: 'Починить базу', description: 'Полностью восстановить HP (' + Math.ceil(baseState.hp) + '/' + baseState.maxHp + ')', cost: Math.ceil((baseState.maxHp - baseState.hp) * waveNumber), state: 'buy', onBuy: () => {baseState.hp = baseState.maxHp;}}
            : {title: 'Починить базу', description: 'База цела', state: 'max'};
          items.splice(2, 0, repairItem);                            // ремонт идёт третьим в списке базы
          if (miniBaseState.hp <= 0) {
            const restoreMiniBase = {title: 'Восстановить базу экспедиции', description: 'Полностью восстановить HP (' + Math.ceil(miniBaseState.hp) + '/' + miniBaseState.maxHp + ')', cost: 50000, state: 'buy', onBuy: () => {miniBaseState.hp = miniBaseState.maxHp;}}
            items.splice(0, 0, restoreMiniBase);
          }
          if (bossSlimeDead) {
            const fuelItem = baseState.fuel < baseState.maxFuel
              ? {title: 'Пополнить топливо', description: 'Полностью восстановить топливо (' + Math.ceil(baseState.fuel) + '/' + baseState.maxFuel + ')', cost: Math.ceil((baseState.maxFuel - baseState.fuel) * 1000), state: 'buy', onBuy: () => {baseState.fuel = baseState.maxFuel;}}
              : {title: 'Пополнить топливо', description: 'Максимум топлива', state: 'max'};
            items.splice(8, 0, fuelItem);     
          }
        } else {
          const makeMainBase = { title: 'Сделать эту базу Основной', description: 'Предыдущая база и биом перестанет быть основными!', cost: 150000, state: 'buy', onBuy: () => {getMainBase().biome.isMainBase = false; isMainBase = true; main_biome = current_biome;} }
          return [makeMainBase]
        }
      }
      return items;
    }

    let currentShopItems = [], lastShopHtml = '';
    // Перерисовывает окно магазина. Если не force — только когда HTML реально изменился (чтобы не терять клики)
    function renderShop(force) {
      currentShopItems = getShopItems();
      let html = '<div class="tabs">' + getShopTabs().map(name => '<button data-tab="' + name + '" class="' + (name === shopTab ? 'on' : '') + '">' + name + '</button>').join('')
        + '<span style="margin-left:auto">Очки: <b style="color:var(--ac)">' + Math.floor(points) + '</b>' + (devModeEnabled ? ' · DEV' : '') + '</span></div>';
      if (currentShopItems.length === 0) {
        html += '<div class="it empty"><div>Еще чу-чуть и тут что-то появится!<small>Продолжай играть — товары откроются сами.</small></div></div>';
      } else {
        html += currentShopItems.map((item, index) => {
          const label = item.state === 'equipped' ? 'В инвентаре' : item.state === 'own' ? 'Взять' : item.state === 'max' ? '—' : 'Купить ' + approximateNumber(item.cost);
          const disabled = item.state === 'equipped' || item.state === 'max' || (item.state === 'buy' && !devModeEnabled && points < item.cost);
          return '<div class="it"><div>' + item.title + '<small>' + item.description + '</small></div><button data-i="' + index + '" ' + (disabled ? 'disabled' : '') + '>' + label + '</button></div>';
        }).join('');
      }
      if (force || html !== lastShopHtml) {shopElement.innerHTML = html; lastShopHtml = html;}
    }

    const dirtModal = document.getElementById('dirtModal');
    let lastDirtHtml = '';

    dirtModal.addEventListener('click', (e) => {
      const planetEl = e.target.closest('.planet');
      if (!planetEl) return;

      const biomeId = planetEl.dataset.biome;
      const biome = BIOMES.find(b => b.id === biomeId);
      if (!biome) return;

      if (biome.costPoints > points || biome.costFuel > baseState.fuel || miniBaseState.hp <= 0 || waveActive ) return;
      if (current_biome === biomeId) return;
      points -= biome.costPoints;
      baseState.fuel -= biome.costFuel;
      selectBiome(biomeId);
      toggleDirtModal();
    });
  
    function renderDirtModal(force) {
      let planetsHtml = '';
      for (const biome of BIOMES) {
        const selected = biome.id === current_biome ? ' selected' : '';
        const disabledClass = ((points >= biome.costPoints) && (baseState.fuel >= biome.costFuel) && (miniBaseState.hp > 0) && !waveActive) || (biome.id === main_biome && !waveActive) ? '' : ' disabled';
        const costPointsText = main_biome === biome.id && biome.costPoints === 0 ? '' : `Очков: ${biome.costPoints}`;
        const costFuelText = main_biome === biome.id && biome.costFuel === 0 ? '' : `Топливо: ${biome.costFuel}`;
        const repairText = miniBaseState.hp <= 0 && biome.id !== main_biome ? 'Почините базу в магазине' : '';
        planetsHtml +=
          `<div class="planet${selected}${disabledClass}" data-biome="${biome.id}">` +
            `<div class="icon"></div>` +
            `<div class="name">${biome.name}</div>` + 
            `<div class="cost">${costPointsText}</div>` +
            `<div class="cost">${costFuelText}</div>` +
            `<div class="cost">${repairText}</div>` +
          `</div>`;
      }

      const html = '<div class="box">'
        +   '<div class="title">Биомы</div>'
        +   '<div class="body">' + planetsHtml + '</div>'
        +   '<div class="hint">Escape - выход</div>'
        + '</div>';

      if (force || html !== lastDirtHtml) {
        dirtModal.innerHTML = html;
        lastDirtHtml = html;
      }
    }

    function openDirtModal() {
        renderDirtModal(true);
        dirtModal.classList.remove('hidden');
        isDirtWindowOpen = true;
    }

    function closeDirtModal() {
        dirtModal.classList.add('hidden');
        isDirtWindowOpen = false;
    }

    function toggleDirtModal() {
      !isDirtWindowOpen ? openDirtModal() : closeDirtModal();
    }

    shopElement.addEventListener('click', event => {
      const tabButton = event.target.closest('[data-tab]');
      if (tabButton) {shopTab = tabButton.dataset.tab; renderShop(true); return;}
      const itemButton = event.target.closest('[data-i]');
      if (!itemButton || itemButton.disabled) return;
      const item = currentShopItems[itemButton.dataset.i];
      if (!item) return;
      if (item.state === 'buy' && !devModeEnabled) {if (points < item.cost) return; points -= item.cost;}   // в режиме разработчика покупка бесплатна
      if (item.state === 'buy') logPurchase(item.title);   // в график попадают только покупки, а не «Взять»
      item.onBuy();
      renderShop(true);
    });

    function formatMinutesSeconds(totalSeconds) {
      const seconds = Math.max(0, Math.ceil(totalSeconds));
      return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
    }

    // Верхняя панель со статами
    function updateHud() {
      const expeditionText = isMainBase ? '' : 'Время экспедиции: <b>' + formatMinutesSeconds(expedition_time_left) + '</b>'
      const fuelText = bossSlimeDead ? 'Топливо: <b>' + Math.round(baseState.fuel) + '/' + baseState.maxFuel + '</b>' : '';
      const waveText = waveActive ? 'идёт волна ' + waveNumber + ' · врагов: ' + (countWaveEnemiesLeft() + spawnQueue.length)
        : 'волна ' + (waveNumber + 1) + ' через <b>' + formatMinutesSeconds(waveTimer) + '</b>';
      hudElement.innerHTML = '<span>Очки: <b>' + approximateNumber(Math.floor(points)) + '</b></span>'
        + '<span>HP: <b>' + Math.ceil(player.hp) + '/' + player.maxHp + '</b></span>'
        + '<span>Энергия: <b>' + Math.floor(player.energy) + '/' + player.maxEnergy + '</b></span>'
        + '<span>' + waveText + '</span>'
