<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Miner</title>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #14161c;
      --panel: #222733;
      --tx: #e8e8ee;
      --ac: #f5c542
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 14px monospace;
      display: flex;
      flex-direction: column;
      align-items: center
    }

    #hud {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      padding: 8px;
      max-width: 960px;
      width: 100%;
      box-sizing: border-box
    }

    #hud b {
      color: var(--ac)
    }

    #wrap {
      position: relative;
      width: 100%;
      max-width: 960px
    }

    canvas {
      width: 100%;
      image-rendering: pixelated;
      background: #000;
      display: block;
      cursor: crosshair
    }

    #dev {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      gap: 4px;
      z-index: 6;
      align-items: center;
      font-size: 11px
    }

    #dev input {
      width: 90px;
      background: #0d0f14;
      color: var(--tx);
      border: 2px solid #444c60;
      padding: 4px;
      font: 12px monospace
    }

    #modal {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(600px, 94%);
      max-height: 90%;
      overflow: auto;
      background: var(--panel);
      border: 3px solid var(--ac);
      padding: 10px;
      box-sizing: border-box;
      z-index: 5
    }

    #modal.h {
      display: none
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap
    }

    .tabs .on {
      border-color: var(--ac);
      color: var(--ac)
    }

    .it {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      border: 2px solid #444c60;
      padding: 6px;
      margin-bottom: 6px
    }

    .it small {
      opacity: .75;
      display: block
    }

    button {
      background: #2d3446;
      color: var(--tx);
      border: 2px solid #444c60;
      padding: 6px 8px;
      font: 12px monospace;
      cursor: pointer
    }

    button:disabled {
      opacity: .45;
      cursor: default
    }

    button:not(:disabled):hover {
      border-color: var(--ac)
    }

    #help {
      padding: 8px;
      max-width: 960px;
      opacity: .8;
      font-size: 12px
    }
  </style>
</head>

<body>
  <div id="hud"></div>
  <div id="wrap">
    <canvas id="c" width="960" height="540"></canvas>
    <div id="dev"><span id="devs"></span><input id="code" placeholder="код разраб." autocomplete="off"><button
        id="okc">OK</button></div>
    <div id="modal" class="h"></div>
  </div>
  <div id="chartOverlay" style="display:none;position:fixed;inset:0;z-index:100;background:#0d0f14">
    <canvas id="incomeChart" style="display:block;width:100%;height:100%"></canvas>
  </div>
  <div id="help">A/D — ходить · W/Пробел — прыжок · ПКМ — копать · ЛКМ — бить оружием · F — телепорт на базу · B —
    магазин (на базе) · G - график · <button id="callw">Позвать волну сейчас</button></div>
  <script src="chart.js"></script>
  <script src="draw.js"></script>
  <script>
    /* ======================================================================
       MINER — оглавление
       1. Настройки и данные (константы, блоки, оружие, инструменты, улучшения)
       2. Состояние игры (все изменяемые переменные)
       3. Вспомогательные функции
       4. Создание мира, игрока и новой игры
       5. Действия игрока (движение, копание, атака, телепорт)
       6. Враги и волны
       7. Обновление игры (один кадр)
       8. Отрисовка
       9. Магазин и интерфейс (HUD)
       10. Ввод (клавиатура, мышь) и главный цикл
       ====================================================================== */

    /* ============================ 1. НАСТРОЙКИ ============================ */

    // --- Размеры мира и экрана ---
    const TILE_SIZE = 20;                 // размер одного блока в пикселях
    const WORLD_WIDTH = 48;               // ширина мира в блоках
    const WORLD_HEIGHT = 150;              // высота мира в блоках
    const SURFACE_ROW = 8;                // номер строки, с которой начинается земля
    const GROUND_Y = SURFACE_ROW * TILE_SIZE;   // координата Y поверхности в пикселях
    const CANVAS_WIDTH = 960;
    const CANVAS_HEIGHT = 540;

    // --- База (20% ширины мира, высота — половина ширины) ---
    const BASE_WIDTH = WORLD_WIDTH * TILE_SIZE * 0.2;
    const BASE_LEFT = (WORLD_WIDTH * TILE_SIZE - BASE_WIDTH) / 2;
    const BASE_HEIGHT = BASE_WIDTH / 2;
    const BASE_TOP = GROUND_Y - BASE_HEIGHT;
    const BASE_CENTER_X = BASE_LEFT + BASE_WIDTH / 2;

    // --- Физика и общие параметры ---
    const GRAVITY = 900;
    const MAX_FALL_SPEED = 500;
    const DIG_COOLDOWN = 0.18;            // пауза между ударами инструментом (сек)
    const REVEAL_RADIUS = 10;              // радиус, который игрок открывает из тумана (блоки)
    const FOG_DIM_RADIUS = 8;             // дальше этого радиуса исследованная зона затемняется
    const FOG_SOLID_BLOCKS_VISIBLE = 1; // сколько твёрдых блоков "пробивает" взгляд: 1 = виден только первый блок, дальше туман
    const TURRET_RANGE = 130;             // дальность орудия базы от края базы (пиксели)

    // --- Пещеры ---
    const CAVE_WORM_COUNT = 12;            // сколько червеобразных ходов создаётся
    const CAVE_SLIME_LIMIT = 40;          // максимум синих слизней в пещерах
    const CAVE_SLIME_CHASE_DISTANCE = 110;
    const CAVE_RESPAWN_INTERVAL_SEC = 20;   // раз в сколько секунд появляется новый слизень
    const CAVE_RESPAWN_MIN_DISTANCE = 12;   // не ближе скольких блоков к игроку

    // --- Волны ---
    const FIRST_WAVE_DELAY_SEC = 180;     // первая волна через 3 минуты
    const MAX_WAVE_DELAY_MIN = 6;         // потолок ожидания между волнами
    const SPAWN_INTERVAL_SEC = 1.2;       // пауза между появлением врагов в волне

    // --- Блоки ---
    const BLOCK = {DIRT: 1, CLAY: 2, GRAVEL: 3, COBBLESTONE: 4, IRON_ORE: 5, CRYSTAL: 6, VOID_ORE: 7};
    // durability — крепкость, level — нужный уровень инструмента, points — очки за добычу
    const BLOCK_TYPES = [null,
      {name: 'земля', durability: 5, level: 1, points: 1, colors: ['#7a4a26', '#6b3f20', '#8a5830', '#5e3519']},
      {name: 'глина', durability: 8, level: 1, points: 3, colors: ['#8b6a4a', '#5a8f8c', '#9a7550', '#4e7f7f']},
      {name: 'гравий', durability: 12, level: 2, points: 6, colors: ['#b8bcc2', '#a4a8ae', '#c9cdd2', '#9298a0']},
      {name: 'булыжник', durability: 20, level: 3, points: 15, colors: ['#5a5d63', '#4a4d53', '#6a6d73', '#3c3f45']},
      {name: 'железная руда', durability: 35, level: 4, points: 40, colors: ['#5a5d63', '#8a7a6a', '#c9803a', '#4a4d53']},
      {name: 'кристалл', durability: 60, level: 5, points: 120, colors: ['#2a3a5a', '#4fd8e8', '#2a6a8a', '#a8f4ff']},
      {name: 'порода бездны', durability: 999, level: 6, points: 500, colors: ['#251e2b', '#653747', '#b66a4a', '#d9b77e']}
    ];
    
    const BLOCK_LAYERS = [
      {
        maxDepth: 10,
        oxygenCost: 0,
        blocks: [
          [BLOCK.DIRT, 75],
          [BLOCK.CLAY, 20],
          [BLOCK.GRAVEL, 4],
          [BLOCK.COBBLESTONE, 1],
        ],
      },
      {
        maxDepth: 30,
        oxygenCost: 5,
        blocks: [
          [BLOCK.DIRT, 25],
          [BLOCK.CLAY, 35],
          [BLOCK.GRAVEL, 25],
          [BLOCK.COBBLESTONE, 15],
        ],
      },
      {
        maxDepth: 60,
        oxygenCost: 15,
        blocks: [
          [BLOCK.CLAY, 5],
          [BLOCK.GRAVEL, 45],
          [BLOCK.COBBLESTONE, 50],
        ],
      },
      {
        maxDepth: 100,
        oxygenCost: 40,
        blocks: [
          [BLOCK.GRAVEL, 5],
          [BLOCK.COBBLESTONE, 75],
          [BLOCK.IRON_ORE, 20],
        ],
      },
      {
        maxDepth: Infinity,
        oxygenCost: 100,
        blocks: [
          [BLOCK.COBBLESTONE, 70],
          [BLOCK.IRON_ORE, 25],
          [BLOCK.CRYSTAL, 5],
        ],
      },
    ];

    // --- Оружие (ЛКМ) ---
    // damage — урон, cooldown — секунд между ударами, energyCost — энергия за удар, radiusTiles — радиус в блоках
    const WEAPONS = [
      {name: 'Палка', damage: 2, cooldown: 1, energyCost: 5, radiusTiles: 1, cost: 0, color: '#b58a4a'},
      {name: 'Деревянный меч', damage: 4, cooldown: 1, energyCost: 10, radiusTiles: 2, cost: 50, color: '#d9a65a'},
      {name: 'Каменный меч', damage: 10, cooldown: 0.8, energyCost: 15, radiusTiles: 2, cost: 500, color: '#a9b0b8'},
      {name: 'Железный меч', damage: 18, cooldown: 0.7, energyCost: 23, radiusTiles: 3, cost: 3000, color: '#e0e0ea'},
      {name: 'Кристальный меч', damage: 35, cooldown: 0.6, energyCost: 40, radiusTiles: 3, cost: 10000, color: '#4fd8e8'}];

    // --- Инструменты (ПКМ) ---
    // level — какие блоки может копать, power — сколько крепкости снимает за удар
    const TOOLS = [
      {name: 'Деревянная лопата', level: 1, power: 1, energyCost: 1, radiusTiles: 1, cost: 0},
      {name: 'Каменная лопата', level: 1, power: 3, energyCost: 2, radiusTiles: 2, cost: 60},
      {name: 'Деревянная кирка', level: 2, power: 5, energyCost: 3, radiusTiles: 1, cost: 450},
      {name: 'Железная лопата', level: 2, power: 6, energyCost: 1, radiusTiles: 3, cost: 2500},
      {name: 'Каменная кирка', level: 3, power: 8, energyCost: 4, radiusTiles: 2, cost: 6000},
      {name: 'Железная кирка', level: 4, power: 14, energyCost: 6, radiusTiles: 2, cost: 12000},
      {name: 'Кристальная кирка', level: 5, power: 24, energyCost: 9, radiusTiles: 3, cost: 25000}];

    // --- Орудие базы (индекс = уровень улучшения) ---
    const TURRET_LEVELS = [null, {damage: 3, cooldown: 1.5}, {damage: 6, cooldown: 1.1}, {damage: 12, cooldown: 0.8}];

    // --- Враги волн ---
    const GREEN_SLIME = 0, BLUE_SLIME = 1, YELLOW_SLIME = 2;
    const SLIME_TYPES = [
      {hp: 5, damage: 5, speed: 15, points: 5, color: '#4fc84f' , shadeColor: "#2f9a2f" },    // зелёный
      {hp: 10, damage: 15, speed: 18, points: 20, color: "#3f6fe0" , shadeColor: "#2a4aa0" } , // синий
      {hp: 30, damage: 35, speed: 20, points: 60, color: "#deb63e" , shadeColor: "#6f5b1e"}];  // желтый
    
    const SLIME_JUMP_POWER = 300;      // сила прыжка слизня (высота ~50 пикселей, чуть выше 2 блоков)
    const SLIME_MAX_STEP_BLOCKS = 2;

    // --- Улучшения магазина ---
    // steps: [цена, новое значение]. describe — текущее состояние, format — подпись следующей ступени, apply — применить.
    // Состояние (player, baseState) объявлено ниже, функции вызываются позже, поэтому порядок объявления не важен.
    const formatPercent = value => Math.round(value * 100) + '%';
    const UPGRADES = {
      energy: {
        title: 'Энергия', steps: [[25, 50], [150, 100], [1000, 220], [8000, 480]],
        describe: () => 'Макс. энергия: ' + player.maxEnergy, format: v => v,
        apply: v => {player.maxEnergy = v; player.energy = v;}
      },
      energyRegen: {
        title: 'Регенерация энергии', steps: [[25, 2], [200, 4], [1000, 9], [7500, 15]],
        describe: () => 'Сейчас ' + player.energyRegen + '/сек вне базы', format: v => v + '/сек',
        apply: v => player.energyRegen = v
      },
      maxHp: {
        title: 'Макс. HP', steps: [[40, 150], [200, 200], [1100, 300], [8000, 450]],
        describe: () => 'Сейчас ' + player.maxHp, format: v => v,
        apply: v => {player.hp += v - player.maxHp; player.maxHp = v;}
      },
      hpRegen: {
        title: 'Регенерация HP', steps: [[60, 1], [1200, 3], [8800, 7]],
        describe: () => 'Сейчас ' + player.hpRegen + '/сек вне базы', format: v => v + '/сек',
        apply: v => player.hpRegen = v
      },
      maxOxygen: {
        title: 'Макс. кислорода', steps: [[60, 200], [1200, 600], [8800, 3000]],
        describe: () => 'Сейчас ' + player.maxOxygen, format: v => v,
        apply: v => {player.oxygen += v - player.maxOxygen; player.maxOxygen = v;}
      },
      oxygenRegen: {
        title: 'Регенерация кислорода', steps: [[200, 100], [1500, 300], [10000, 1000]],
        describe: () => 'Сейчас ' + player.oxygenRegen + '/сек', format: v => v,
        apply: v => player.oxygenRegen
      },
      moveSpeed: {
        title: 'Скорость бега', steps: [[50, 110], [800, 130], [6000, 155]],
        describe: () => 'Сейчас ' + player.moveSpeed, format: v => v,
        apply: v => player.moveSpeed = v
      },
      jumpPower: {
        title: 'Высота прыжка', steps: [[80, 320], [600, 360], [3000, 400]],
        describe: () => 'Сейчас ' + player.jumpPower, format: v => v,
        apply: v => player.jumpPower = v
      },
      armor: {
        title: 'Броня', steps: [[150, 0.1], [800, 0.2], [3500, 0.35]],
        describe: () => 'Снижает урон на ' + formatPercent(player.armor), format: formatPercent,
        apply: v => player.armor = v
      },
      luck: {
        title: 'Удача шахтёра', steps: [[80, 0.25], [1500, 0.5], [9000, 1]],
        describe: () => 'Бонус очков с блоков: +' + formatPercent(player.luck), format: v => '+' + formatPercent(v),
        apply: v => player.luck = v
      },
      energySaving: {
        title: 'Экономия энергии', steps: [[200, 0.15], [1500, 0.2], [6500, 0.3]],
        describe: () => 'Меньше затраты на удары и копание: −' + formatPercent(player.energySaving), format: formatPercent,
        apply: v => player.energySaving = v
      },
      teleportCooldown: {
        title: 'Перезарядка телепорта', steps: [[200, 20], [800, 16], [5000, 10]],
        describe: () => 'Сейчас ' + player.teleportCooldownSec + ' с', format: v => v + ' с',
        apply: v => player.teleportCooldownSec = v
      },
      baseEnergyRegen: {
        title: 'Регенерация энергии у базы', steps: [[150, 15], [800, 30], [3500, 45], [9000, 80]],
        describe: () => 'Сейчас ' + baseState.energyRegen + '/сек', format: v => v + '/сек',
        apply: v => baseState.energyRegen = v
      },
      baseHealRate: {
        title: 'Лечение у базы', steps: [[200, 20], [1000, 40], [5200, 80]],
        describe: () => 'Сейчас ' + baseState.playerHealRate + ' HP/сек', format: v => v + '/сек',
        apply: v => baseState.playerHealRate = v
      },
      baseMaxHp: {
        title: 'HP базы', steps: [[250, 750], [2000, 1000], [10000, 1500]],
        describe: () => 'Макс. HP базы: ' + baseState.maxHp, format: v => v,
        apply: v => {baseState.hp += v - baseState.maxHp; baseState.maxHp = v;}
      },
      baseRepair: {
        title: 'Авторемонт базы', steps: [[300, 1], [1200, 3], [4000, 8]],
        describe: () => 'Сейчас ' + baseState.repairRate + ' HP/сек', format: v => v + ' HP/сек',
        apply: v => baseState.repairRate = v
      },
      baseMining: {
        title: 'Автозарабаток', steps: [[200,  3], [1500, 15], [8000, 90]],
        describe: () => 'Сейчас ' + baseState.miningRate + ' очков/сек', format: v => v + ' очков/сек',
        apply : v => baseState.miningRate = v
      },
      turret: {
        title: 'Орудие базы', steps: [[500, 1], [1500, 2], [6000, 3]],
        describe: () => baseState.turretLevel ? 'Ур. ' + baseState.turretLevel + ': урон ' + TURRET_LEVELS[baseState.turretLevel].damage + ', 1 выстрел/' + TURRET_LEVELS[baseState.turretLevel].cooldown + 'с' : 'Не построено',
        format: v => 'ур. ' + v + ' (урон ' + TURRET_LEVELS[v].damage + ', 1/' + TURRET_LEVELS[v].cooldown + 'с)',
        apply: v => baseState.turretLevel = v
      }
    };
    // Какие улучшения показывать на вкладках магазина
    const SHOP_TABS = {
      'Персонаж': ['energy', 'energyRegen', 'maxHp', 'hpRegen', 'maxOxygen', 'oxygenRegen', 'moveSpeed', 'jumpPower', 'armor', 'luck', 'energySaving', 'teleportCooldown'],
      'База': ['baseEnergyRegen', 'baseHealRate', 'baseMaxHp', 'baseRepair', 'baseMining', 'turret']
    };
    const SHOP_TAB_NAMES = ['Персонаж', 'Оружие', 'Инструменты', 'База'];
    const DEV_CODE = '1337';

    /* ======================== 2. СОСТОЯНИЕ ИГРЫ ======================== */

    // Элементы страницы
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const hudElement = document.getElementById('hud');
    const shopElement = document.getElementById('modal');
    const devLabelElement = document.getElementById('devs');
    const devCodeInput = document.getElementById('code');

    // Мир: blocks[строка][столбец] — тип блока (0 = пусто), blockDurability — оставшаяся крепкость,
    // explored — открыта ли клетка из тумана
    let blocks, blockDurability, explored;

    let player;                 // объект игрока (создаётся в createPlayer)
    let enemies = [];           // все враги: и волны, и пещерные слизни
    let floatingTexts = [];     // всплывающие числа (+очки, -урон)
    let turretBeams = [];       // вспышки выстрелов орудия базы

    let points = 0;             // очки игрока
    let baseState;              // состояние базы (HP, регенерация, орудие)
    let ownedWeapons = [], ownedTools = [];
    let upgradeLevels = {};     // сколько ступеней купили в каждом улучшении

    let waveNumber = 0, waveActive = false, waveTimer = 0, spawnQueue = [], spawnTimer = 0;
    let isGameOver = false;
    let messageText = '', messageTimer = 0;
    let isShopOpen = false, shopTab = 'Персонаж';
    let devModeEnabled = false;
    let cameraY = 0;
    let turretTimer = 0;
    let caveRespawnTimer = 0;
    let fps = 0, fpsFrameCount = 0, fpsTimer = 0;

    const keysDown = {};
    const mouse = {x: 0, y: 0, leftDown: false, rightDown: false};

    /* ===================== 3. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ===================== */

    // Детерминированное "случайное" число 0..1 по зерну (для текстур и распределения блоков)
    function pseudoRandom(seed) {const s = Math.sin(seed) * 10000; return s - Math.floor(s);}
  
    function showMessage(text) {messageText = text; messageTimer = 2.5;}
    function addFloatingText(x, y, text, color) {floatingTexts.push({x, y, text, color, timer: 1});}

    function updateFps(realDeltaSec) {
      fpsFrameCount++;
      fpsTimer += realDeltaSec;
      if (fpsTimer >= 0.5) {
        fps = Math.round(fpsFrameCount / fpsTimer);
        fpsFrameCount = 0;
        fpsTimer = 0;
      }
    }


    function isSolidTile(col, row) {
      if (col < 0 || col >= WORLD_WIDTH || row >= WORLD_HEIGHT) return true;   // стены и дно мира
      if (row < 0) return false;
      return blocks[row][col] > 0;
    }
    // Пересекается ли прямоугольник (в пикселях) с твёрдыми блоками
    function boxHitsBlocks(x, y, width, height) {
      for (let col = Math.floor(x / TILE_SIZE); col <= Math.floor((x + width - 0.01) / TILE_SIZE); col++)
        for (let row = Math.floor(y / TILE_SIZE); row <= Math.floor((y + height - 0.01) / TILE_SIZE); row++)
          if (isSolidTile(col, row)) return true;
      return false;
    }

    // Считает твёрдые блоки на линии от игрока до клетки (сама клетка и стартовая не учитываются)
    function countSolidBlocksBetween(fromCol, fromRow, toCol, toRow) {
      const distance = Math.hypot(toCol - fromCol, toRow - fromRow);
      const steps = Math.ceil(distance * 4);                       // шаг луча 0.25 блока
      const startCol = Math.floor(fromCol), startRow = Math.floor(fromRow);
      const targetCol = Math.floor(toCol), targetRow = Math.floor(toRow);
      let lastCol = -1, lastRow = -1, solidCount = 0;
      for (let i = 0; i <= steps; i++) {
        const t = steps === 0 ? 0 : i / steps;
        const col = Math.floor(fromCol + (toCol - fromCol) * t);
        const row = Math.floor(fromRow + (toRow - fromRow) * t);
        if (col === lastCol && row === lastRow) continue;          // эту клетку уже проверили
        lastCol = col; lastRow = row;
        if ((col === startCol && row === startRow) || (col === targetCol && row === targetRow)) continue;
        if (isSolidTile(col, row)) solidCount++;
      }
      return solidCount;
    }

    function playerCenterX() {return player.x + player.width / 2;}
    function playerCenterY() {return player.y + player.height / 2;}
    function isPlayerInBaseZone() {
      return playerCenterX() > BASE_LEFT && playerCenterX() < BASE_LEFT + BASE_WIDTH
        && player.y + player.height > GROUND_Y - 4 && player.y < GROUND_Y + 2;
    }
    function isPlayerOnSurface() {return player.y + player.height > GROUND_Y - 4 && player.y < GROUND_Y + 2;}

    /* ================= 4. СОЗДАНИЕ МИРА, ИГРОКА, НОВАЯ ИГРА ================= */

    // Какой блок ставить на данной глубине: чем глубже, тем ценнее. roll — случайное число 0..1.
    function chooseBlockTypeByDepth(depth, roll) {
      const layer = BLOCK_LAYERS.find(layer => depth < layer.maxDepth);

      let value = roll;

      for (const [block, weight] of layer.blocks) {
        value -= weight / 100;

        if (value < 0) {
          return block;
        }
      }

      // На случай ошибок округления
      return layer.blocks.at(-1)[0];
    }

    // Вырезает квадрат пустоты (ширина 3 или 4 блока) — кисть для пещер
    function carveCave(centerCol, centerRow, width) {
      for (let dc = -1; dc <= width - 2; dc++)
        for (let dr = -1; dr <= width - 2; dr++) {
          const col = centerCol + dc, row = centerRow + dr;
          if (col >= 0 && col < WORLD_WIDTH && row >= SURFACE_ROW + 3 && row <= WORLD_HEIGHT - 2) {
            blocks[row][col] = 0;
            blockDurability[row][col] = 0;
          }
        }
    }


    function generateWorld() {
      const seed = Math.random() * 1000;
      blocks = []; blockDurability = []; explored = [];
      for (let row = 0; row < WORLD_HEIGHT; row++) {
        blocks[row] = []; blockDurability[row] = []; explored[row] = [];
        for (let col = 0; col < WORLD_WIDTH; col++) {
          let blockType = 0;                                   // над землёй — воздух
          if (row >= SURFACE_ROW) {
            blockType = row === WORLD_HEIGHT - 1 ? BLOCK.VOID_ORE   // нижний слой мира
              : chooseBlockTypeByDepth(row - SURFACE_ROW, pseudoRandom(col * 37 + row * 101 + seed));
          }
          blocks[row][col] = blockType;
          blockDurability[row][col] = blockType ? BLOCK_TYPES[blockType].durability : 0;
          explored[row][col] = row < SURFACE_ROW;              // небо видно сразу, подземелье в тумане
        }
      }
      // Пещеры: червеобразные ходы шириной 3-4 блока на разной глубине
      for (let i = 0; i < CAVE_WORM_COUNT; i++) {
        let x = 2 + Math.random() * (WORLD_WIDTH - 4);
        let y = SURFACE_ROW + 6 + i * ((WORLD_HEIGHT - SURFACE_ROW - 12) / CAVE_WORM_COUNT) + Math.random() * 4;
        let angle = Math.random() * Math.PI * 2;
        const length = 30 + Math.random() * 20;
        const width = Math.random() < 0.5 ? 3 : 4;
        for (let step = 0; step < length; step++) {
          carveCave(Math.round(x), Math.round(y), width);
          angle += (Math.random() - 0.5) * 0.7;
          x += Math.cos(angle);
          y += Math.sin(angle) * 0.7;
          x = Math.min(WORLD_WIDTH - 3, Math.max(2, x));
          y = Math.min(WORLD_HEIGHT - 4, Math.max(SURFACE_ROW + 4, y));
        }
      }
    }

    function createPlayer() {
      player = {
        x: 10 * TILE_SIZE, y: GROUND_Y - 18, width: 12, height: 18,
        velocityX: 0, velocityY: 0, onGround: false, facing: 1,
        hp: 100, maxHp: 100, hpRegen: 0.5,
        energy: 15, maxEnergy: 15, energyRegen: 1,
        oxygen: 50, maxOxygen: 50, oxygenRegen: 25,
        moveSpeed: 95, jumpPower: 290,
        armor: 0,             // доля снижения урона
        luck: 0,              // бонус очков с блоков
        energySaving: 0,      // доля экономии энергии
        teleportCooldownSec: 25, teleportTimer: 0,
        weaponIndex: 0, toolIndex: 0,
        attackTimer: 0, digTimer: 0, swingAnimTimer: 0
      };
    }

    function getDepthFraction(row) { return (row - SURFACE_ROW) / (WORLD_HEIGHT - SURFACE_ROW); }

    // Чем глубже, тем чаще попадаются сильные слизни
    function pickCaveSlimeType(depthFraction) {
      const roll = Math.random();
      if (depthFraction < 0.25) return roll < 0.85 ? GREEN_SLIME : BLUE_SLIME;
      if (depthFraction < 0.6)  return roll < 0.3 ? GREEN_SLIME : roll < 0.85 ? BLUE_SLIME : YELLOW_SLIME;
      return roll < 0.1 ? GREEN_SLIME : roll < 0.45 ? BLUE_SLIME : YELLOW_SLIME;
    }

    // Слизень на полу клетки (col, row). Глубже: больше HP (до ×2.5), урон (до ×2) и награда (до ×2)
    function createCaveSlimeAt(col, row) {
      const depthFraction = getDepthFraction(row);
      const slime = createEnemy(pickCaveSlimeType(depthFraction), col * TILE_SIZE + TILE_SIZE / 2, (row + 1) * TILE_SIZE, true, 1 + 1.5 * depthFraction);
      slime.damage = Math.round(slime.damage * (1 + depthFraction));
      slime.points = Math.round(slime.points * (1 + depthFraction));
      return slime;
    }

    // Начальная расстановка: ищем все "полы" пещер, перемешиваем и расставляем, чтобы глубже было гуще
    function spawnCaveSlimes() {
      const floorTiles = [];
      for (let col = 0; col < WORLD_WIDTH; col++)
        for (let row = SURFACE_ROW + 5; row < WORLD_HEIGHT - 1; row++)
          if (!blocks[row][col] && blocks[row + 1][col]) floorTiles.push({ col, row });
      floorTiles.sort(() => Math.random() - 0.5);
      let count = 0;
      for (const tile of floorTiles) {
        if (count >= CAVE_SLIME_LIMIT) break;
        const chance = 0.02 + 0.05 * getDepthFraction(tile.row);   // у поверхности 2%, на дне 7%
        if (Math.random() < chance) { enemies.push(createCaveSlimeAt(tile.col, tile.row)); count++; }
      }
    }

    function updateCaveRespawn(dt) {
      caveRespawnTimer -= dt;
      if (caveRespawnTimer > 0) return;
      caveRespawnTimer = CAVE_RESPAWN_INTERVAL_SEC;
      if (enemies.filter(e => e.isCaveSlime).length >= CAVE_SLIME_LIMIT) return;
      for (let attempt = 0; attempt < 30; attempt++) {
        const col = Math.floor(Math.random() * WORLD_WIDTH);
        const row = SURFACE_ROW + 5 + Math.floor(Math.random() * (WORLD_HEIGHT - SURFACE_ROW - 6));
        const isFloorTile = !blocks[row][col] && blocks[row + 1][col];
        const distanceToPlayer = Math.hypot(col + 0.5 - playerCenterX() / TILE_SIZE, row + 0.5 - playerCenterY() / TILE_SIZE);
        if (isFloorTile && distanceToPlayer > CAVE_RESPAWN_MIN_DISTANCE) { enemies.push(createCaveSlimeAt(col, row)); return; }
      }
    }

    function startNewGame() {
      createBlockTextures();
      generateWorld();
      createPlayer();
      points = 0;
      upgradeLevels = {};
      ownedWeapons = WEAPONS.map((w, i) => i === 0);
      ownedTools = TOOLS.map((t, i) => i === 0);
      baseState = {hp: 500, maxHp: 500, energyRegen: 10, playerHealRate: 10, repairRate: 0, miningRate: 0, turretLevel: 0};
      enemies = []; floatingTexts = []; turretBeams = [];
      waveNumber = 0; waveActive = false; waveTimer = FIRST_WAVE_DELAY_SEC; spawnQueue = []; spawnTimer = 0;
      turretTimer = 0; isGameOver = false; messageText = ''; messageTimer = 0;
      isShopOpen = false; shopElement.className = 'h';
      caveRespawnTimer = CAVE_RESPAWN_INTERVAL_SEC;
      spawnCaveSlimes();
      resetIncomeStats();
      revealAroundPlayer();
    }

    // Открывает клетки вокруг игрока: в пустоте до радиуса REVEAL_RADIUS, за блоками видно только FOG_SOLID_BLOCKS_VISIBLE блоков
    function revealAroundPlayer() {
      const centerCol = playerCenterX() / TILE_SIZE, centerRow = playerCenterY() / TILE_SIZE;
      const rowFrom = Math.max(SURFACE_ROW, Math.floor(centerRow - REVEAL_RADIUS - 1));
      const rowTo = Math.min(WORLD_HEIGHT - 1, Math.ceil(centerRow + REVEAL_RADIUS + 1));
      const colFrom = Math.max(0, Math.floor(centerCol - REVEAL_RADIUS - 1));
      const colTo = Math.min(WORLD_WIDTH - 1, Math.ceil(centerCol + REVEAL_RADIUS + 1));
      for (let row = rowFrom; row <= rowTo; row++)
        for (let col = colFrom; col <= colTo; col++) {
          if (explored[row][col]) continue;
          if (Math.hypot(col + 0.5 - centerCol, row + 0.5 - centerRow) > REVEAL_RADIUS) continue;
          if (countSolidBlocksBetween(centerCol, centerRow, col + 0.5, row + 0.5) < FOG_SOLID_BLOCKS_VISIBLE) explored[row][col] = true;
        }
    }

    /* ====================== 5. ДЕЙСТВИЯ ИГРОКА ====================== */

    function teleportToBase() {
      if (isGameOver) return;
      if (player.teleportTimer > 0) {addFloatingText(playerCenterX(), player.y - 6, 'Телепорт перезаряжается ' + Math.ceil(player.teleportTimer) + 'с', '#ffe706'); return;}
      player.x = BASE_CENTER_X - player.width / 2;
      player.y = GROUND_Y - player.height;
      player.velocityX = player.velocityY = 0;
      player.teleportTimer = player.teleportCooldownSec;
    }

    function toggleShop() {
      if (isGameOver) return;
      if (isShopOpen) {isShopOpen = false; shopElement.className = 'h'; return;}
      if (!isPlayerInBaseZone()) {showMessage('Магазин открывается в зоне базы'); return;}
      if (waveActive) {showMessage('Магазин закрыт во время волны!');return;}
      isShopOpen = true; shopElement.className = ''; renderShop(true);
    }

    function damagePlayer(amount) {
      const finalDamage = amount * (1 - player.armor);
      player.hp -= finalDamage;
      addFloatingText(playerCenterX(), player.y - 6, '-' + (+finalDamage.toFixed(1)), '#ff5555');
    }

    function damageEnemy(enemy, amount) {
      enemy.hp -= amount;
      enemy.hurtTimer = 0.12;
      addFloatingText(enemy.x, enemy.y - 22, '-' + amount, '#fff');
      if (enemy.hp <= 0) {
        earnPoints(enemy.points);
        addFloatingText(enemy.x, enemy.y - 32, '+' + enemy.points, '#f5c542');
        enemies.splice(enemies.indexOf(enemy), 1);
      }
    }

    // ЛКМ: удар по ближайшему врагу в сторону курсора (энергия тратится только при попадании)

    function playerAttack() {
      if (player.attackTimer > 0 || isGameOver) return;
      const weapon = WEAPONS[player.weaponIndex];
      const energyCost = weapon.energyCost * (1 - player.energySaving);
      const cx = playerCenterX(), cy = playerCenterY();
      let target = null, targetDistance = Infinity;
      for (const enemy of enemies) {
        const distance = Math.hypot(enemy.x - cx, (enemy.y - 5) - cy);
        const inRange = distance <= weapon.radiusTiles * TILE_SIZE;
        const onCursorSide = Math.sign(enemy.x - cx) === Math.sign(mouse.x - cx) || Math.abs(enemy.x - cx) < 8;
        if (inRange && onCursorSide && distance < targetDistance) {target = enemy; targetDistance = distance;}
      }
      if (!target) return;
      if (player.energy < energyCost) {addFloatingText(playerCenterX(), player.y - 6, 'Нет энергии для удара', '#ffe706'); player.attackTimer = 0.3; return;}
      player.energy -= energyCost;
      player.attackTimer = weapon.cooldown;
      player.swingAnimTimer = 0.15;
      player.facing = target.x >= cx ? 1 : -1; // поварачивается в сторону врага перед ударом
      damageEnemy(target, weapon.damage);
    }

    // ПКМ: удар инструментом по блоку под курсором
    function playerDig() {
      if (player.digTimer > 0 || isGameOver) return;
      const col = Math.floor(mouse.x / TILE_SIZE), row = Math.floor((mouse.y + cameraY) / TILE_SIZE);
      if (col < 0 || col >= WORLD_WIDTH || row < 0 || row >= WORLD_HEIGHT || !blocks[row][col]) return;
      const tool = TOOLS[player.toolIndex];
      const energyCost = tool.energyCost * (1 - player.energySaving);
      const distance = Math.hypot(col * TILE_SIZE + TILE_SIZE / 2 - playerCenterX(), row * TILE_SIZE + TILE_SIZE / 2 - playerCenterY());
      if (distance > tool.radiusTiles * TILE_SIZE + TILE_SIZE / 2) return;     // слишком далеко
      const blockType = BLOCK_TYPES[blocks[row][col]];
      if (tool.level < blockType.level) {addFloatingText(playerCenterX(), player.y - 6, 'Нужен инструмент уровня ' + blockType.level + ' для блока «' + blockType.name + '»', '#ffe706'); player.digTimer = 0.5; return;}
      if (player.energy < energyCost) {addFloatingText(playerCenterX(), player.y - 6, 'Нет энергии! Отдохни на базе', '#ffe706'); player.digTimer = 0.5; return;}
      player.energy -= energyCost;
      player.digTimer = DIG_COOLDOWN;
      blockDurability[row][col] -= tool.power;
      if (blockDurability[row][col] <= 0) {
        const reward = Math.max(1, Math.round(blockType.points * (1 + player.luck)));
        earnPoints(reward);
        addFloatingText(col * TILE_SIZE + TILE_SIZE / 2, row * TILE_SIZE, '+' + reward, '#f5c542');
        blocks[row][col] = 0;
      }
    }

    // Ходьба, прыжок, гравитация и столкновения с блоками
    function updatePlayerMovement(dt) {
      const direction = (keysDown.KeyD || keysDown.ArrowRight ? 1 : 0) - (keysDown.KeyA || keysDown.ArrowLeft ? 1 : 0);
      player.velocityX = direction * player.moveSpeed;
      if (direction) player.facing = direction;
      if ((keysDown.KeyW || keysDown.ArrowUp || keysDown.Space) && player.onGround) {player.velocityY = -player.jumpPower; player.onGround = false;}
      player.velocityY = Math.min(MAX_FALL_SPEED, player.velocityY + GRAVITY * dt);

      let newX = player.x + player.velocityX * dt;
      newX = Math.max(0, Math.min(WORLD_WIDTH * TILE_SIZE - player.width, newX));
      if (!boxHitsBlocks(newX, player.y, player.width, player.height)) player.x = newX;

      const newY = player.y + player.velocityY * dt;
      player.onGround = false;
      if (!boxHitsBlocks(player.x, newY, player.width, player.height)) {
        player.y = newY;
      } else {
        if (player.velocityY > 0) {player.onGround = true; player.y = Math.floor((newY + player.height) / TILE_SIZE) * TILE_SIZE - player.height;}
        else player.y = Math.floor(newY / TILE_SIZE + 1) * TILE_SIZE;
        player.velocityY = 0;
      }
    }

    /* ========================== 6. ВРАГИ И ВОЛНЫ ========================== */

    // y врага — координата его "ног"
    function createEnemy(slimeTypeIndex, x, y, isCaveSlime, hpMultiplier = 1) {
      const type = SLIME_TYPES[slimeTypeIndex];
      const hp = Math.round(type.hp * hpMultiplier);
      return {
        x, y, isCaveSlime, hp, maxHp: hp, damage: type.damage, shadeColor: type.shadeColor, color: type.color,  speed: type.speed,
        points: type.points, attackTimer: 0, hurtTimer: 0, velocityY: 0, direction: Math.random() < 0.5 ? 1 : -1
      };
    }

    // Сколько [зелёных, синих, желтых] слизней в волне
    function getWaveEnemyCounts(wave) {
      const enemies = {
        1: [5, 0, 0], 2: [10, 0, 0], 3: [13, 2, 0],
        4: [15, 5, 0], 5: [20, 10, 1], 6:[25, 15, 3],
        7: [25, 20, 6]
      }
      
      if (enemies[wave]) {
        return enemies[wave]
      }

      return [5 * (wave - 3), 12 * (wave - 3),  9 * (wave - 3)];
    }

    function getWaveBonus(wave) {
      const bonuses = {1: 90, 2: 180, 3: 400, 4: 800, 5: 1500, 6: 2200, 7: 2800, 8: 4000, 9: 7000, 10: 12000}
      if (bonuses[wave]) {
        return bonuses[wave]
      }
      
      return  2000 * (wave - 3)
    }

    function startWave() {
      waveNumber++;
      waveActive = true;
      const [greenCount, blueCount, yellowCount] = getWaveEnemyCounts(waveNumber);
      spawnQueue = [];
      for (let i = 0; i < greenCount; i++) spawnQueue.push(GREEN_SLIME);
      for (let i = 0; i < blueCount; i++) spawnQueue.push(BLUE_SLIME);
      for (let i = 0; i < yellowCount; i++) spawnQueue.push(YELLOW_SLIME);
      spawnQueue.sort(() => Math.random() - 0.5);
      spawnTimer = 0;
      showMessage('Волна ' + waveNumber + '! Защити базу!');
    }

    function spawnWaveEnemy() {
      const hpMultiplier = 1 + 0.1 * Math.max(0, waveNumber - 3);        // с 4-й волны слизни крепчают
      const fromLeft = Math.random() < 0.5;
      enemies.push(createEnemy(spawnQueue.pop(), fromLeft ? -8 : WORLD_WIDTH * TILE_SIZE + 8, GROUND_Y, false, hpMultiplier));
    }

    function countWaveEnemiesLeft() {return enemies.filter(e => !e.isCaveSlime).length;}

    function updateWaves(dt) {
      if (!waveActive) {
        waveTimer -= dt;
        if (waveTimer <= 0) startWave();
        return;
      }
      spawnTimer -= dt;
      if (spawnQueue.length && spawnTimer <= 0) {spawnWaveEnemy(); spawnTimer = SPAWN_INTERVAL_SEC;}
      if (!spawnQueue.length && countWaveEnemiesLeft() === 0) {           // волна отбита
        waveActive = false;
        waveTimer = Math.min(waveNumber + 3, MAX_WAVE_DELAY_MIN) * 60;    // 4, 5, 6...
        const bonus = getWaveBonus(waveNumber);
        earnPoints(bonus);
        showMessage('Волна ' + waveNumber + ' отбита! Награда +' + bonus);
      }
    }


    // Пещерный слизень: патрулирует, при приближении игрока преследует, подчиняется гравитации
    function updateCaveSlime(slime, dt) {
      const isOnGround = slime.velocityY === 0;
      const dx = playerCenterX() - slime.x, dy = playerCenterY() - (slime.y - 5);
      const isChasing = Math.hypot(dx, dy) < CAVE_SLIME_CHASE_DISTANCE;
      if (isChasing && Math.abs(dx) > 6) slime.direction = Math.sign(dx);
      const nextX = slime.x + slime.direction * slime.speed * dt;
      const hitsWall = boxHitsBlocks(nextX - 7, slime.y - 10, 14, 10);
      const ledgeAhead = !isSolidTile(Math.floor((nextX + slime.direction * 7) / TILE_SIZE), Math.floor((slime.y + 1) / TILE_SIZE));
      if (hitsWall || (ledgeAhead && !isChasing)) {
        if (!isChasing) slime.direction *= -1;
        else if (hitsWall && isOnGround) {
          // препятствие не выше 2 блоков: над ним (на высоте 2 блоков) место свободно
          const canStepUp = !boxHitsBlocks(nextX - 7, slime.y - 10 - SLIME_MAX_STEP_BLOCKS * TILE_SIZE, 14, 10);
          if (canStepUp) slime.velocityY = -SLIME_JUMP_POWER;
        }
      }
      else slime.x = nextX;
      slime.velocityY += GRAVITY * dt;
      const nextY = slime.y + slime.velocityY * dt;
      if (slime.velocityY > 0 && boxHitsBlocks(slime.x - 7, nextY - 10, 14, 10)) {slime.y = Math.floor(nextY / TILE_SIZE) * TILE_SIZE; slime.velocityY = 0;}
      else slime.y = nextY;
      if (Math.abs(dx) < 12 && Math.abs(dy) < 14 && slime.attackTimer <= 0) {slime.attackTimer = 1; damagePlayer(slime.damage);}
    }

    // Слизень волны: идёт к базе, а если игрок на поверхности рядом — к нему
    function updateWaveSlime(slime, dt) {
      const playerNearby = isPlayerOnSurface() && Math.abs(slime.x - playerCenterX()) < 90;
      const baseIsOnRight = slime.x < BASE_CENTER_X;
      const targetX = playerNearby ? playerCenterX() : (baseIsOnRight ? BASE_LEFT - 7 : BASE_LEFT + BASE_WIDTH + 7);
      const reachedTarget = playerNearby ? Math.abs(slime.x - playerCenterX()) < 12
        : (baseIsOnRight ? slime.x >= BASE_LEFT - 8 : slime.x <= BASE_LEFT + BASE_WIDTH + 8);
      if (!reachedTarget) {slime.x += Math.sign(targetX - slime.x) * slime.speed * dt; return;}
      if (slime.attackTimer > 0) return;
      slime.attackTimer = 1;
      if (playerNearby) damagePlayer(slime.damage); else baseState.hp -= slime.damage;
    }

    function updateEnemies(dt) {
      for (const enemy of enemies) {
        enemy.attackTimer -= dt;
        enemy.hurtTimer -= dt;
        if (enemy.isCaveSlime) updateCaveSlime(enemy, dt); else updateWaveSlime(enemy, dt);
      }
    }

    // Орудие базы стреляет по ближайшему наземному врагу
    function updateTurret(dt) {
      turretTimer -= dt;
      if (baseState.turretLevel && turretTimer <= 0) {
        let target = null, targetDistance = Infinity;
        for (const enemy of enemies) {
          if (enemy.isCaveSlime) continue;
          const distance = Math.abs(enemy.x - BASE_CENTER_X);
          if (distance < BASE_WIDTH / 2 + TURRET_RANGE && distance < targetDistance) {target = enemy; targetDistance = distance;}
        }
        if (target) {
          const level = TURRET_LEVELS[baseState.turretLevel];
          turretTimer = level.cooldown;
          turretBeams.push({x1: BASE_CENTER_X, y1: BASE_TOP - 30, x2: target.x, y2: target.y - 6, timer: 0.12});
          damageEnemy(target, level.damage);
        }
      }
      for (let i = turretBeams.length - 1; i >= 0; i--) {
        turretBeams[i].timer -= dt;
        if (turretBeams[i].timer <= 0) turretBeams.splice(i, 1);
      }
    }

    function updateRegeneration(dt) {
      const inBase = isPlayerInBaseZone();
      player.energy = Math.min(player.maxEnergy, player.energy + (inBase ? baseState.energyRegen : player.energyRegen) * dt);
      player.hp = Math.min(player.maxHp, player.hp + (inBase ? baseState.playerHealRate : player.hpRegen) * dt);
      if (baseState.repairRate && baseState.hp > 0) baseState.hp = Math.min(baseState.maxHp, baseState.hp + baseState.repairRate * dt);
    }

    function updateOxygen(dt) {
      const NoOxygenMultiplyDamage = 5
      const depth = Math.max(0, Math.floor((player.y + player.height - GROUND_Y) / TILE_SIZE));
      const layer = BLOCK_LAYERS.find(layer => depth < layer.maxDepth);
      if (layer.maxDepth <= 10) {
        player.oxygen = Math.min(player.maxOxygen, player.oxygen) + (player.oxygenRegen * dt); return  
      } else {
        if (player.oxygen >= 0) {
          player.oxygen -= layer.oxygenCost * dt;
        } else {
          player.hp -= (layer.oxygenCost * dt) * NoOxygenMultiplyDamage;
        }
      }

    }

    function updateMiningBase(dt) {
      if (baseState.miningRate <= 0) return;
      earnPoints(baseState.miningRate * dt);
    }


    function checkDefeat() {
      if (baseState.hp <= 0) {baseState.hp = 0; isGameOver = true; isShopOpen = false; shopElement.className = 'h';}
      if (player.hp <= 0) {                                       // смерть игрока: телепорт и минус половина очков
        points = Math.floor(points / 2);
        player.hp = player.maxHp;
        player.teleportTimer = 0;
        teleportToBase();
        showMessage('Ты погиб! Потеряна половина очков');
      }
    }

    function updateFloatingTexts(dt) {
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        floatingTexts[i].timer -= dt;
        floatingTexts[i].y -= 20 * dt;
        if (floatingTexts[i].timer <= 0) floatingTexts.splice(i, 1);
      }
    }

    function updateGame(dt) {
      player.attackTimer -= dt; player.digTimer -= dt; player.teleportTimer -= dt; player.swingAnimTimer -= dt;
      messageTimer -= dt;
      updatePlayerMovement(dt);
      cameraY = Math.max(0, Math.min(WORLD_HEIGHT * TILE_SIZE - CANVAS_HEIGHT, playerCenterY() - CANVAS_HEIGHT / 2));
      revealAroundPlayer();
      if (mouse.rightDown) playerDig();
      if (mouse.leftDown) playerAttack();
      updateRegeneration(dt);
      updateOxygen(dt);
      updateMiningBase(dt);
      updateTurret(dt);
      updateCaveRespawn(dt);
      updateWaves(dt);
      updateIncomeStats(dt);
      updateEnemies(dt);
      checkDefeat();
      updateFloatingTexts(dt);
    }

    /* ======================= 9. МАГАЗИН И ИНТЕРФЕЙС ======================= */

    // Одна строка улучшения-лестницы: следующая ступень или «максимум»
    function buildUpgradeItem(upgradeKey) {
      const upgrade = UPGRADES[upgradeKey], level = upgradeLevels[upgradeKey] || 0, step = upgrade.steps[level];
      if (!step) return {title: upgrade.title, description: upgrade.describe() + ' · максимум', state: 'max'};
      const [cost, newValue] = step;
      return {
        title: upgrade.title + ' → ' + upgrade.format(newValue), description: upgrade.describe(), cost, state: 'buy',
        onBuy: () => {upgrade.apply(newValue); upgradeLevels[upgradeKey] = level + 1;}
      };
    }

    // Список товаров текущей вкладки. state: 'buy' (купить), 'own' (куплено, можно взять), 'equipped', 'max'
    function getShopItems() {
      if (shopTab === 'Оружие') return WEAPONS.map((w, i) => ({
        title: w.name, description: 'Урон ' + w.damage + ' · 1 удар/' + w.cooldown + 'с · энергия ' + w.energyCost + ' · радиус ' + w.radiusTiles + ' бл.',
        cost: w.cost, state: player.weaponIndex === i ? 'equipped' : ownedWeapons[i] ? 'own' : 'buy',
        onBuy: () => {ownedWeapons[i] = true; player.weaponIndex = i;}
      }));
      if (shopTab === 'Инструменты') return TOOLS.map((t, i) => ({
        title: t.name, description: 'Уровень ' + t.level + ' · копание ' + t.power + ' ед. · энергия ' + t.energyCost + ' · радиус ' + t.radiusTiles + ' бл.',
        cost: t.cost, state: player.toolIndex === i ? 'equipped' : ownedTools[i] ? 'own' : 'buy',
        onBuy: () => {ownedTools[i] = true; player.toolIndex = i;}
      }));
      const items = SHOP_TABS[shopTab].map(buildUpgradeItem);
      if (shopTab === 'База') {
        const repairItem = baseState.hp < baseState.maxHp
          ? {title: 'Починить базу', description: 'Полностью восстановить HP (' + Math.ceil(baseState.hp) + '/' + baseState.maxHp + ')', cost: (baseState.maxHp - baseState.hp) * waveNumber, state: 'buy', onBuy: () => {baseState.hp = baseState.maxHp;}}
          : {title: 'Починить базу', description: 'База цела', state: 'max'};
        items.splice(2, 0, repairItem);                            // ремонт идёт третьим в списке базы
      }
      return items;
    }

    let currentShopItems = [], lastShopHtml = '';
    // Перерисовывает окно магазина. Если не force — только когда HTML реально изменился (чтобы не терять клики)
    function renderShop(force) {
      currentShopItems = getShopItems();
      let html = '<div class="tabs">' + SHOP_TAB_NAMES.map(name => '<button data-tab="' + name + '" class="' + (name === shopTab ? 'on' : '') + '">' + name + '</button>').join('')
        + '<span style="margin-left:auto">Очки: <b style="color:var(--ac)">' + Math.floor(points) + '</b>' + (devModeEnabled ? ' · DEV' : '') + '</span></div>';
      html += currentShopItems.map((item, index) => {
        const label = item.state === 'equipped' ? 'Экипировано' : item.state === 'own' ? 'Взять' : item.state === 'max' ? '—' : 'Купить ' + (devModeEnabled ? '0' : item.cost);
        const disabled = item.state === 'equipped' || item.state === 'max' || (item.state === 'buy' && !devModeEnabled && points < item.cost);
        return '<div class="it"><div>' + item.title + '<small>' + item.description + '</small></div><button data-i="' + index + '" ' + (disabled ? 'disabled' : '') + '>' + label + '</button></div>';
      }).join('');
      if (force || html !== lastShopHtml) {shopElement.innerHTML = html; lastShopHtml = html;}
    }

    shopElement.addEventListener('click', event => {
      const tabButton = event.target.closest('[data-tab]');
      if (tabButton) {shopTab = tabButton.dataset.tab; renderShop(true); return;}
      const itemButton = event.target.closest('[data-i]');
      if (!itemButton || itemButton.disabled) return;
      const item = currentShopItems[itemButton.dataset.i];
      if (!item) return;
      if (item.state === 'buy' && !devModeEnabled) {if (points < item.cost) return; points -= item.cost;}   // в режиме разработчика покупка бесплатна
      if (item.state === 'buy') logPurchase(item.title);   // в график попадают только покупки, а не «Взять»
      item.onBuy();
      renderShop(true);
    });

    function formatMinutesSeconds(totalSeconds) {
      const seconds = Math.max(0, Math.ceil(totalSeconds));
      return Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
    }

    // Верхняя панель со статами
    function updateHud() {
      const waveText = waveActive ? 'идёт волна ' + waveNumber + ' · врагов: ' + (countWaveEnemiesLeft() + spawnQueue.length)
        : 'волна ' + (waveNumber + 1) + ' через <b>' + formatMinutesSeconds(waveTimer) + '</b>';
      hudElement.innerHTML = '<span>Очки: <b>' + Math.floor(points) + '</b></span>'
        + '<span>HP: <b>' + Math.ceil(player.hp) + '/' + player.maxHp + '</b></span>'
        + '<span>Энергия: <b>' + Math.floor(player.energy) + '/' + player.maxEnergy + '</b></span>'
        + '<span>' + WEAPONS[player.weaponIndex].name + ' · ' + TOOLS[player.toolIndex].name + '</span>'
        + '<span>' + waveText + '</span>';
      devLabelElement.textContent = devModeEnabled ? 'DEV' : '';
      if (isShopOpen) renderShop(false);
    }

    /* ============== 10. ВВОД (КЛАВИАТУРА, МЫШЬ) И ГЛАВНЫЙ ЦИКЛ ============== */

    addEventListener('keydown', event => {
      if (event.target.tagName === 'INPUT') {if (event.code === 'Enter') document.getElementById('okc').click(); return;}   // печатаем код — игра не реагирует
      if (event.code === 'KeyG' && !event.repeat) { toggleIncomeChart(); return; }
      if (event.code === 'Escape' && isChartOpen) { toggleIncomeChart(); return; }
      if (isChartOpen) return;   // на паузе остальные клавиши не работают
      keysDown[event.code] = true;
      if (['Space', 'ArrowUp', 'ArrowDown'].includes(event.code)) event.preventDefault();
      if (event.repeat) return;
      if (event.code === 'KeyF') teleportToBase();
      if (event.code === 'Escape' && isShopOpen) { toggleShop(); return; }
      if (event.code === 'KeyB') toggleShop();
    });
    addEventListener('keyup', event => {keysDown[event.code] = false;});

    function updateMousePosition(event) {
      const rect = canvas.getBoundingClientRect();
      mouse.x = (event.clientX - rect.left) * canvas.width / rect.width;
      mouse.y = (event.clientY - rect.top) * canvas.height / rect.height;
    }
    canvas.addEventListener('mousemove', updateMousePosition);
    canvas.addEventListener('contextmenu', event => event.preventDefault());       // ПКМ не открывает меню браузера
    canvas.addEventListener('mousedown', event => {
      updateMousePosition(event);
      if (isGameOver) {startNewGame(); return;}
      if (event.button === 0) mouse.leftDown = true;
      if (event.button === 2) mouse.rightDown = true;
    });
    addEventListener('mouseup', event => {
      if (event.button === 0) mouse.leftDown = false;
      if (event.button === 2) mouse.rightDown = false;
    });

    document.getElementById('callw').onclick = () => {if (!waveActive && !isGameOver) waveTimer = 0;};   // позвать волну без ожидания
    document.getElementById('okc').onclick = () => {                                                          // инструмент разработчика
      if (devCodeInput.value.trim() === DEV_CODE) {
        devModeEnabled = !devModeEnabled;
        showMessage(devModeEnabled ? 'Режим разработчика: покупки бесплатны' : 'Режим разработчика выключен');
      } else showMessage('Неверный код');
      devCodeInput.value = ''; devCodeInput.blur();
    };

    let lastFrameTime = performance.now(), hudTimer = 0;
    function gameLoop(now) {
      const realDelta = (now - lastFrameTime) / 1000;
      const dt = Math.min(0.05, realDelta);
      lastFrameTime = now;
      updateFps(realDelta);
      if (!isGameOver && !isChartOpen && !isShopOpen) updateGame(dt);
      render();
      hudTimer -= dt;
      if (hudTimer <= 0) {updateHud(); hudTimer = 0.15;}
      requestAnimationFrame(gameLoop);
    }

    startNewGame();
    requestAnimationFrame(gameLoop);
  </script>
</body>

</html>
